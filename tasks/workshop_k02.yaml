title: Hype oder Substanz? Eine Einordnung
difficulty: 4
question: |
  **Szenario:** In deinem Unternehmen wird über KI diskutiert. Einige sind euphorisch,
  andere halten alles für einen kurzlebigen Hype wie damals vor dem KI-Winter.

  ---

  **Aufgabe (allein oder in der Lerngruppe):**

  1. Erstelle eine **Pro-/Contra-Übersicht**: Argumente, warum die aktuelle KI-Welle nachhaltig ist –
     und Argumente, warum Vorsicht angebracht ist.
  2. Belege beide Seiten mit je **zwei historischen bzw. aktuellen Beispielen**.
  3. Formuliere eine **begründete Einschätzung** in 5–8 Sätzen: Warum ist die heutige Situation anders
     als in den KI-Wintern?
  4. Lass dir von **Copilot** einen ersten Entwurf erstellen und **korrigiere/ergänze** ihn kritisch.

  **Deliverables:** Pro-/Contra-Tabelle + begründete Einschätzung + Notiz, was du an Copilots Entwurf geändert hast.
tip: |
  Nutze die drei Treiber (Daten, Rechenleistung, Algorithmen) als roten Faden für das „diesmal ist es anders".
solution: |
  Bewertungskriterien: ausgewogene Argumente auf beiden Seiten; historische Bezüge (KI-Winter) korrekt;
  klare Begründung über die drei Treiber; erkennbare **eigene kritische Leistung** gegenüber dem Copilot-Entwurf
  (Faktencheck, Ergänzungen, Streichungen).
