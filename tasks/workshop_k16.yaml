title: Maßgeschneiderten Assistenten per Prompt bauen
difficulty: 4
question: |
  Baue **in Copilot** einen spezialisierten Assistenten für eine fiktive Rolle – nur mit Prompting.

  **Schritt 1 – Rolle wählen:** Denk dir eine nützliche Assistenzrolle aus (z. B. „Onboarding-Buddy
  für neue Mitarbeitende", „Meeting-Protokollant", „freundlicher Reklamations-Assistent").

  **Schritt 2 – System-Prompt schreiben:** Definiere Aufgabe, Tonfall, feste Antwortstruktur, Grenzen
  („antworte nicht zu Thema X"). Nutze das Muster aus dem Kapitel.

  **Schritt 3 – Testszenarien:**
  ```text
  Erfinde 4 typische Situationen für diesen Assistenten und spiele sie mit ihm durch.
  ```

  **Schritt 4 – verbessern:** Wo hat der Assistent versagt? Überarbeite den System-Prompt und teste erneut.

  **Deliverable:** der finale System-Prompt + Protokoll der Testläufe (vorher/nachher).
tip: |
  Gute Assistenten haben klare Grenzen: Sag explizit, was er NICHT tun soll.
solution: |
  Bewertungskriterien: durchdachter System-Prompt (Aufgabe, Ton, Struktur, Grenzen), 4 Tests, sichtbare
  Verbesserung nach Überarbeitung. Lernziel: aus einem Allzweck-LLM per Prompt einen Spezialisten machen.
