title: Rechnungsdaten mit Copilot extrahieren
difficulty: 1
question: |
  Mach das **live in Copilot** – Copilot erzeugt das Dokument selbst.
  ```text
  Erstelle den Text einer fiktiven Rechnung (Absender, Rechnungsnummer, Datum, 3 Positionen,
  Gesamtbetrag, Zahlungsziel).
  ```
  Dann:
  ```text
  Extrahiere aus dieser Rechnung folgende Felder als Tabelle: Rechnungsnummer, Datum, Gesamtbetrag,
  Zahlungsziel.
  ```
tip: |
  Dokumentenverarbeitung heißt: aus unstrukturiertem Text strukturierte Felder gewinnen.
solution: |
  Erwartetes Ergebnis: korrekt extrahierte Felder in Tabellenform. Lernziel: das Grundprinzip automatischer
  Dokumentenextraktion erleben.
