title: Nachhaltigkeits-Initiative und Rebound-Effekt (Copilot)
difficulty: 3
question: |
  Entwickle **in Copilot** eine Nachhaltigkeitsinitiative für ein selbst erzeugtes Szenario.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen mit hohem Ressourcenverbrauch und beschreibe den größten Hebel.
  ```
  **Schritt 2:**
  ```text
  Entwirf eine KI-gestützte Maßnahme mit messbarem Ziel (z. B. -15 % Energie) und benötigten Daten.
  ```
  **Schritt 3 – kritisch:**
  ```text
  Erkläre den Rebound-Effekt an diesem Beispiel und bedenke außerdem den Energieverbrauch der KI
  selbst. Bleibt die Maßnahme unterm Strich nachhaltig?
  ```

  Bewerte selbst: Ist der Netto-Nutzen wirklich positiv?
tip: |
  Rebound: Effizienzgewinne werden oft durch Mehrnutzung „aufgefressen". Und KI selbst verbraucht Energie – beides einrechnen.
solution: |
  Erwartetes Ergebnis: Maßnahme mit messbarem Ziel plus ehrliche Betrachtung von Rebound und KI-Fußabdruck.
  Lernziel: Nachhaltigkeit ganzheitlich (netto) bewerten, nicht schöngerechnet.
