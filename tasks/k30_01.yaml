title: Automatisierbaren Ablauf mit Copilot planen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde eine kleine, wiederkehrende Aufgabe im Büro (z. B. „neue Anfrage kommt per Formular →
  Bestätigungsmail → Eintrag in Liste"). Beschreibe sie als Wenn-Dann-Ablauf in nummerierten Schritten.
  ```
  Dann:
  ```text
  Welche dieser Schritte könnte man mit einem Low-Code-Tool (ohne Programmierung) automatisieren?
  ```
tip: |
  Low-Code baut Abläufe per Baukasten (Wenn-Dann) zusammen – ideal für einfache, wiederkehrende Aufgaben.
solution: |
  Erwartetes Ergebnis: klarer Wenn-Dann-Ablauf und Einschätzung der Automatisierbarkeit. Lernziel: Automatisierungs-
  logik in Schritten denken.
