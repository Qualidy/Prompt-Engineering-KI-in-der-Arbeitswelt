title: Veränderungs-Kommunikation mit Copilot entwerfen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Schreibe eine kurze, motivierende Ankündigung an ein Team, dass ab nächstem Monat Microsoft
  Copilot eingeführt wird. Betone den Nutzen für die Mitarbeitenden, nicht nur fürs Unternehmen.
  ```
  Dann:
  ```text
  Formuliere die Ankündigung so um, dass sie auch skeptische Kolleg:innen abholt (Ängste ernst nehmen).
  ```
tip: |
  Menschen fragen zuerst „Was bedeutet das für mich?" – gute Change-Kommunikation beantwortet genau das.
solution: |
  Erwartetes Ergebnis: eine nutzenorientierte Ankündigung und eine empathischere Variante. Lernziel:
  Veränderung aus Sicht der Betroffenen kommunizieren.
