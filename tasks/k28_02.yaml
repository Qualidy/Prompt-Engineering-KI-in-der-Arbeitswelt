title: Dokumente klassifizieren und weiterleiten
difficulty: 2
question: |
  Arbeite **in Copilot** – lass die Dokumente zuerst erzeugen.
  ```text
  Erstelle die Kurztexte von 5 verschiedenen Eingangsdokumenten (z. B. Rechnung, Bewerbung,
  Beschwerde, Bestellung, Werbung).
  ```
  Dann:
  ```text
  Klassifiziere jedes Dokument nach Typ und schlage die zuständige Abteilung vor. Stelle es als
  Tabelle dar (Dokument, Typ, Abteilung, Begründung).
  ```
tip: |
  Automatische Klassifikation und Weiterleitung ist ein Klassiker: spart das manuelle Sortieren der Eingangspost.
solution: |
  Erwartetes Ergebnis: korrekte Klassifikation und plausible Weiterleitung. Lernziel: Dokumente automatisch
  sortieren und routen.
