title: KI-Geschäftsmodell pitchen (Copilot)
difficulty: 4
question: |
  Entwickle **in Copilot** ein KI-Geschäftsmodell bis zum kurzen Pitch – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde ein Problem eines Kundensegments, das man mit einem KI-Angebot lösen könnte.
  ```
  **Schritt 2:**
  ```text
  Entwickle das Geschäftsmodell: Nutzenversprechen, Zielkunde, Erlösmodell, Schlüsselressourcen,
  Wettbewerbsvorteil.
  ```
  **Schritt 3:**
  ```text
  Formuliere einen 60-Sekunden-Pitch für Investoren.
  ```
  **Schritt 4 – kritische Fragen:** Lass Copilot die 3 härtesten Investorenfragen stellen und beantworte sie selbst.

  **Deliverable:** Geschäftsmodell-Übersicht + 60-Sekunden-Pitch + Antworten auf die harten Fragen.
tip: |
  Ein guter Pitch beantwortet in Sekunden: Welches Problem, für wen, warum ihr, wie verdient ihr Geld?
solution: |
  Bewertungskriterien: klares Nutzenversprechen, tragfähiges Erlösmodell, überzeugender Pitch, souveräner Umgang
  mit kritischen Fragen. Lernziel: eine KI-Idee geschäftlich denken und verteidigen.
