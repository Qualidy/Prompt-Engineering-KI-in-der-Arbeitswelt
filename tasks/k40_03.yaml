title: 30-Tage-Plan zur Prompting-Meisterschaft (Copilot)
difficulty: 3
question: |
  Entwickle **mit Copilot** einen persönlichen Plan, um Prompt Engineering dauerhaft zu beherrschen.

  **Schritt 1:**
  ```text
  Ich möchte in 30 Tagen deutlich besser im Prompting werden. Erstelle einen realistischen Plan mit
  kleinen täglichen/wöchentlichen Übungen, die je 10–15 Minuten dauern.
  ```
  **Schritt 2 – auf deinen Alltag münzen:** Nenne 3 wiederkehrende Aufgaben aus deinem Beruf und lass
  Copilot je eine passende Übung in den Plan einbauen (ohne dass du echte Dokumente brauchst – Copilot
  erzeugt Beispielmaterial).
  **Schritt 3:**
  ```text
  Ergänze, woran ich am Ende merke, dass ich besser geworden bin (konkrete Anzeichen).
  ```

  Bewerte selbst: Ist der Plan realistisch im Alltag durchzuhalten?
tip: |
  Kompetenz entsteht durch kleine, regelmäßige Übung – nicht durch einen großen Einmal-Kraftakt.
solution: |
  Erwartetes Ergebnis: ein realistischer, auf den eigenen Alltag zugeschnittener 30-Tage-Übungsplan mit
  Fortschritts-Anzeichen. Lernziel: Prompting als dauerhafte Gewohnheit etablieren.
