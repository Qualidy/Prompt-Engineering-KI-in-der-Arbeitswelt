title: Abschlussprojekt – eine Aufgabe komplett mit Copilot lösen
difficulty: 4
question: |
  Zeige im Abschlussprojekt, dass du Copilot souverän und verantwortungsvoll einsetzt. Wähle eine
  realistische, wiederkehrende Aufgabe – **ohne echte Dokumente**: Copilot erzeugt alles nötige Material selbst.

  **Schritt 1 – Aufgabe wählen:** Denk dir eine typische Arbeitsaufgabe aus (z. B. „auf Kundenanfragen
  antworten", „Meeting vorbereiten und nachbereiten", „einen kurzen Bericht erstellen").

  **Schritt 2 – Material erzeugen:**
  ```text
  Erfinde eine realistische Ausgangssituation und alle nötigen (fiktiven) Inhalte für diese Aufgabe.
  ```
  **Schritt 3 – Lösen mit System:** Bearbeite die Aufgabe in Copilot mit bewusst eingesetzten Techniken
  (Rolle, Kontext, Format, Few-Shot, Iteration). Dokumentiere deine besten Prompts.

  **Schritt 4 – Qualität sichern:** Prüfe das Ergebnis kritisch (Fakten, Ton, Vollständigkeit) und
  verbessere es in mindestens einer Iteration.

  **Schritt 5 – Reflexion:** Was hat Copilot gut gemacht, wo musstest DU eingreifen? Wie viel Zeit hast
  du gespart – und wo lag die Verantwortung klar beim Menschen?

  **Deliverable:** dokumentierte Prompt-Strecke, das finale Ergebnis + eine kurze Reflexion.
tip: |
  Das Ziel ist nicht „Copilot macht alles", sondern „Ich steuere Copilot souverän und prüfe verantwortungsvoll".
solution: |
  Bewertungskriterien: bewusst eingesetzte Prompt-Techniken, dokumentierte Iteration, kritische Qualitätsprüfung,
  ehrliche Reflexion über Mensch-KI-Arbeitsteilung. Lernziel: alle Kursinhalte in einer realistischen Aufgabe
  souverän und verantwortungsvoll zusammenführen.
