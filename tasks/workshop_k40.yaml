title: Abschluss-Workshop – Team-Prompt-Bibliothek & KI-Fahrplan
difficulty: 4
question: |
  **Szenario:** Als Abschluss bündelt ihr das Gelernte in einem praxistauglichen Ergebnis für euer (künftiges) Team.

  ---

  **Aufgabe (in der Lerngruppe empfohlen):**

  1. Erstellt eine **Team-Prompt-Bibliothek** mit mindestens **8 erprobten Prompts** aus verschiedenen
     Kursthemen (E-Mail, Analyse, Zusammenfassung, Ideenfindung, Dokumente …). Je Eintrag: Zweck, Vorlage,
     Beispielausgabe, Prüf-Hinweise.
  2. Formuliert **Nutzungsregeln** (Qualität, Datenschutz, Verantwortung) auf Basis von Block 4.
  3. Wählt **einen konkreten Use Case** aus eurem Arbeitsumfeld und beschreibt ihn end-to-end:
     Ziel, Daten, KI-/Copilot-Einsatz, Risiken, menschliche Kontrolle.
  4. Erstellt einen **persönlichen 30-Tage-Fahrplan** zum Kompetenzaufbau.
  5. Nutzt **Copilot** durchgehend – und dokumentiert an **zwei Stellen**, wo eure kritische Prüfung
     das KI-Ergebnis verbessert hat.

  **Deliverables:** Prompt-Bibliothek (≥8 Einträge) + Nutzungsregeln + 1 durchdachter Use Case + 30-Tage-Fahrplan.
tip: |
  Dies ist die Synthese des Kurses: Verbindet Prompt-Handwerk (Kapitel 14) mit Verantwortung (Block 4) und
  strategischem Blick (Block 5).
solution: |
  Bewertungskriterien: vollständige, brauchbare Prompt-Bibliothek; klare Nutzungsregeln; durchdachter End-to-End-
  Use-Case mit menschlicher Kontrolle; realistischer Fahrplan; belegte kritische Eigenleistung gegenüber den KI-Ausgaben.
