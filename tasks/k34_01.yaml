title: Black Box vs. Erklärbarkeit mit Copilot
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erkläre den Unterschied zwischen einer „Black Box"-KI und einer erklärbaren KI an einem Beispiel
  (z. B. Kreditentscheidung). Warum ist Erklärbarkeit gerade dort wichtig?
  ```
tip: |
  Bei Entscheidungen über Menschen (Kredit, Job) reicht „die KI hat das so entschieden" nicht – man muss das Warum kennen.
solution: |
  Erwartetes Ergebnis: klarer Unterschied Black Box vs. erklärbar und Begründung für die Bedeutung. Lernziel:
  verstehen, warum Nachvollziehbarkeit oft Pflicht ist.
