title: Strategische KI-Ziele mit Copilot formulieren
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde ein Unternehmen mit einem klaren Geschäftsziel (z. B. schnelleres Wachstum). Leite daraus
  3 strategische KI-Ziele ab, die auf dieses Geschäftsziel einzahlen.
  ```
tip: |
  KI ist kein Selbstzweck – jedes KI-Ziel sollte auf ein übergeordnetes Geschäftsziel einzahlen.
solution: |
  Erwartetes Ergebnis: 3 KI-Ziele, die klar aus dem Geschäftsziel abgeleitet sind. Lernziel: KI strategisch statt
  als Spielerei denken.
