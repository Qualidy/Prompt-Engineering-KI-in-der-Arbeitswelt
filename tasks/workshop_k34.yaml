title: Erklärbarkeits-Konzept mit Copilot
difficulty: 4
question: |
  Entwirf **in Copilot** ein Erklärbarkeits-Konzept für ein fiktives KI-System.

  **Schritt 1:**
  ```text
  Erfinde ein KI-System, das automatisch Entscheidungen über Menschen trifft, und beschreibe es.
  ```
  **Schritt 2:**
  ```text
  Definiere, welche Erklärung jede betroffene Gruppe erhält (Kunde, Sachbearbeiter, Aufsicht) und
  in welcher Form (Klartext, Faktorenliste, Protokoll).
  ```
  **Schritt 3:**
  ```text
  Beschreibe, wie eine Person Widerspruch einlegen und eine menschliche Prüfung verlangen kann.
  ```
  **Schritt 4 – Prüfung:** Reicht das, damit sich niemand einer „unerklärlichen Maschine" ausgeliefert fühlt? Ergänze Lücken.

  **Deliverable:** Erklärbarkeits-Konzept (Zielgruppen, Erklärformen, Widerspruchsweg).
tip: |
  Erklärbarkeit schafft Vertrauen und ist bei Hochrisiko-KI oft gesetzlich verlangt – inkl. Recht auf menschliche Prüfung.
solution: |
  Bewertungskriterien: zielgruppengerechte Erklärungen, konkreter Widerspruchsweg, geschlossene Lücken.
  Lernziel: Nachvollziehbarkeit und Betroffenenrechte konkret verankern.
