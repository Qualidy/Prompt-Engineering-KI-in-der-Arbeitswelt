title: KI-Projektphasen mit Copilot planen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde ein kleines KI-Projekt und plane es in Phasen (z. B. Idee, Daten, Prototyp/MVP, Test,
  Rollout). Nenne je Phase das wichtigste Ziel und ein typisches Risiko.
  ```
tip: |
  KI-Projekte sind selten „einmal bauen, fertig" – sie sind iterativ und datengetrieben.
solution: |
  Erwartetes Ergebnis: sinnvolle Phasen mit Zielen und Risiken. Lernziel: den typischen Ablauf eines KI-Projekts
  verstehen.
