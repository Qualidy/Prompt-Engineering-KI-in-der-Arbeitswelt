title: Copilot seine eigene Antwort erklären lassen
difficulty: 2
question: |
  Teste **in Copilot** Erklärbarkeit direkt.
  ```text
  Bewerte diese fiktive Situation: Soll ein Team eine 4-Tage-Woche einführen? Gib eine klare Empfehlung.
  ```
  Dann verlange die Begründung:
  ```text
  Erkläre Schritt für Schritt, wie du zu dieser Empfehlung gekommen bist, welche Annahmen du
  getroffen hast und was dein größter Unsicherheitsfaktor ist.
  ```
  Beurteile: Wie nachvollziehbar ist die Erklärung wirklich – oder klingt sie nur plausibel?
tip: |
  Vorsicht: Ein LLM kann eine überzeugende Erklärung „nachliefern", die nicht unbedingt dem echten Rechenweg entspricht.
solution: |
  Erwartetes Ergebnis: eine Empfehlung mit nachgereichter Begründung und eine kritische Einschätzung ihrer
  Verlässlichkeit. Lernziel: „plausibel klingend" ist nicht dasselbe wie „echte Erklärbarkeit".
