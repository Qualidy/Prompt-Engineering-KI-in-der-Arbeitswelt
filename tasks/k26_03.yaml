title: PdM-Business-Case mit Fehlalarm-Abwägung (Copilot)
difficulty: 3
question: |
  Erarbeite **in Copilot** einen Business Case für ein selbst erzeugtes Szenario.

  **Schritt 1:**
  ```text
  Erfinde eine teure Maschine, deren ungeplanter Ausfall hohe Kosten verursacht. Nenne Zahlen
  (Ausfallkosten pro Stunde, Häufigkeit).
  ```
  **Schritt 2:**
  ```text
  Schätze grob den Nutzen von Predictive Maintenance (weniger Ausfälle) gegen die Kosten (Sensorik,
  System). Lohnt es sich?
  ```
  **Schritt 3 – kritisch:**
  ```text
  Was passiert bei zu vielen Fehlalarmen (unnötige Wartung) und bei verpassten Warnungen? Wie
  wirken beide auf den Nutzen?
  ```

  Bewerte selbst: Wie belastbar sind deine Annahmen?
tip: |
  Zu viele Fehlalarme untergraben das Vertrauen und die Wirtschaftlichkeit – die Trefferqualität ist entscheidend.
solution: |
  Erwartetes Ergebnis: grober Business Case mit Nutzen/Kosten und Reflexion über Fehlalarme/verpasste Warnungen.
  Lernziel: PdM wirtschaftlich UND mit Blick auf Fehlentscheidungen bewerten.
