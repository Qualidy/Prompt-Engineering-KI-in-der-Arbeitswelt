title: Energieverbrauch von KI mit Copilot einordnen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erkläre, wo bei KI eigentlich Energie verbraucht wird (Training vs. Nutzung) und warum das
  Training großer Modelle so aufwendig ist. Nenne einen anschaulichen Vergleich.
  ```
tip: |
  Das Training großer Modelle ist extrem energieintensiv; die einzelne Nutzung (ein Prompt) ist vergleichsweise klein – summiert sich aber.
solution: |
  Erwartetes Ergebnis: klare Trennung Training/Nutzung und ein anschaulicher Vergleich. Lernziel: den Energie-
  Fußabdruck von KI grob einordnen.
