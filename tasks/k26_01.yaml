title: Wartungsstrategien mit Copilot vergleichen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erkläre an einem Beispiel (z. B. Aufzug) den Unterschied zwischen reaktiver, vorbeugender und
  vorausschauender Wartung. Nenne je einen Vor- und Nachteil. Als Tabelle.
  ```
tip: |
  Vorausschauend = warten, kurz bevor es kaputtgeht (datenbasiert). Vorbeugend = feste Intervalle, egal ob nötig.
solution: |
  Erwartetes Ergebnis: klare Gegenüberstellung der 3 Strategien mit Vor-/Nachteilen. Lernziel: Predictive
  Maintenance von anderen Strategien abgrenzen.
