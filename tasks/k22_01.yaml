title: Automatisierungspotenzial eines Prozesses finden
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde einen wiederkehrenden Büroprozess (z. B. wöchentlicher Statusbericht) und liste die
  Einzelschritte. Markiere je Schritt: gut automatisierbar, teils, oder nur manuell.
  ```
  Dann:
  ```text
  Bei welchem Schritt würde Copilot am meisten Zeit sparen – und warum?
  ```
tip: |
  Gut automatisierbar sind meist wiederkehrende, regelbasierte, textlastige Schritte.
solution: |
  Erwartetes Ergebnis: Prozessschritte mit Automatisierbarkeits-Einordnung und begründetem Copilot-Hebel. Lernziel:
  Automatisierungspotenzial systematisch erkennen.
