title: KI oder klassische Software?
difficulty: 1
question: |
  Ordne die folgenden Systeme zu: Handelt es sich um **klassische Software** (feste Regeln)
  oder um ein **KI-System** (lernt aus Daten)?

  1. Ein Taschenrechner
  2. Ein Spam-Filter, der sich an neue Spam-Arten anpasst
  3. Eine Gehaltsabrechnung nach festen Formeln
  4. Microsoft Copilot, das eine E-Mail zusammenfasst
  5. Eine Ampelsteuerung mit festem Zeitplan
tip: |
  Frage dich: Wurde jeder Fall vorher programmiert – oder erkennt das System selbst Muster?
solution: |
  | System | Einordnung |
  |---|---|
  | Taschenrechner | Klassische Software |
  | Lernender Spam-Filter | KI-System |
  | Gehaltsabrechnung | Klassische Software |
  | Copilot (Zusammenfassung) | KI-System (generative KI) |
  | Ampel mit festem Zeitplan | Klassische Software |
