title: Change-Plan für ein schwieriges Szenario (Copilot)
difficulty: 3
question: |
  Entwirf **in Copilot** einen Change-Plan für ein selbst erzeugtes, schwieriges Szenario.

  **Schritt 1:**
  ```text
  Erfinde eine Situation mit starkem Widerstand gegen eine KI-Einführung (z. B. erfahrene Belegschaft,
  Sorge um Arbeitsplätze).
  ```
  **Schritt 2:**
  ```text
  Entwirf einen Plan nach den Phasen "Auftauen – Verändern – Verfestigen": konkrete Maßnahmen je Phase.
  ```
  **Schritt 3:**
  ```text
  Wie gewinnst du Multiplikatoren/Frühanwender und feierst erste Erfolge sichtbar?
  ```

  Bewerte selbst: An welchem Punkt könnte der Change trotzdem kippen – und wie beugst du vor?
tip: |
  Frühe, sichtbare Erfolge und respektierte Kolleg:innen als Fürsprecher sind stärker als jede Top-down-Ansage.
solution: |
  Erwartetes Ergebnis: Phasenplan mit konkreten Maßnahmen, Multiplikatoren-Strategie und Risikobetrachtung.
  Lernziel: Veränderung strukturiert und menschenzentriert steuern.
