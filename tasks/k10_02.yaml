title: Bereinigungsplan mit Copilot
difficulty: 2
question: |
  Nutze **Copilot** (idealerweise in Excel) für eine kleine Beispieltabelle mit absichtlichen Fehlern
  (fehlende Werte, Dubletten, uneinheitliche Schreibweisen):

  ```text
  Erkenne in dieser Tabelle Qualitätsprobleme und schlage für jedes Problem einen
  konkreten Bereinigungsschritt vor. Weise auf Risiken der jeweiligen Methode hin.
  ```

  Entscheide begründet, wie du mit den fehlenden Werten umgehst (löschen vs. ersetzen).
tip: |
  Bei wenigen fehlenden Werten in großen Datensätzen ist Löschen oft unkritisch – bei vielen kann Ersetzen sinnvoller sein.
solution: |
  Bewertungskriterien: korrekte Problemerkennung; passende Bereinigungsschritte; begründete Entscheidung
  zu fehlenden Werten inkl. Risikobewusstsein.
