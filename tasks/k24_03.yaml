title: Smart-Factory-Konzept kritisch entwickeln (Copilot)
difficulty: 3
question: |
  Entwickle **in Copilot** ein Konzept für eine selbst erzeugte Fertigung.

  **Schritt 1:**
  ```text
  Erfinde einen Produktionsbetrieb und beschreibe 3 konkrete Probleme (Ausschuss, Stillstände, Planung).
  ```
  **Schritt 2:**
  ```text
  Ordne jedem Problem eine passende KI-Anwendung zu, nenne die nötigen Daten und den erwarteten Nutzen.
  ```
  **Schritt 3 – kritisch:**
  ```text
  Welche Voraussetzungen (Sensorik, Datenqualität, Akzeptanz der Mitarbeitenden) müssen erfüllt sein,
  damit das funktioniert? Was ist das größte Umsetzungsrisiko?
  ```

  Bewerte selbst: Welche der 3 KI-Anwendungen würdest du zuerst angehen und warum?
tip: |
  Die Technik ist selten das Problem – Datenqualität, Sensorik und Akzeptanz entscheiden über den Erfolg.
solution: |
  Erwartetes Ergebnis: Problem-Lösungs-Zuordnung mit Datenbedarf, Voraussetzungen und Priorisierung. Lernziel:
  Produktions-KI realistisch und voraussetzungsbewusst planen.
