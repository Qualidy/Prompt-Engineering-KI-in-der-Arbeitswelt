title: Prozess-Verbesserungsvorschlag mit KPIs in Copilot
difficulty: 4
question: |
  Erarbeite **in Copilot** einen entscheidungsreifen Verbesserungsvorschlag – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde einen Geschäftsprozess mit klaren Problemen (lange Durchlaufzeit, Fehler, Nacharbeit).
  ```
  **Schritt 2:**
  ```text
  Definiere 3 KPIs, an denen man den heutigen Zustand misst (z. B. Durchlaufzeit, Fehlerquote).
  ```
  **Schritt 3:**
  ```text
  Entwirf die Copilot-gestützte Verbesserung und schätze, wie sich jeder KPI verändern würde.
  ```
  **Schritt 4:**
  ```text
  Fasse alles in einer einseitigen Vorlage für die Leitung zusammen (Problem, Lösung, KPI-Wirkung, Aufwand).
  ```
  **Schritt 5 – Prüfung:** Sind die KPI-Prognosen belegbar oder Wunschdenken? Kennzeichne Annahmen.

  **Deliverable:** einseitige Entscheidungsvorlage mit KPI-Wirkung.
tip: |
  Entscheider überzeugt man mit Zahlen: Zeige den erwarteten Effekt auf konkrete Kennzahlen – und mach Annahmen transparent.
solution: |
  Bewertungskriterien: 3 messbare KPIs, plausible Wirkungsabschätzung, klare Vorlage, transparente Annahmen.
  Lernziel: Verbesserungen KPI-basiert und entscheidungsreif aufbereiten.
