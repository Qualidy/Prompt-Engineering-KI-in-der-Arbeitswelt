title: Kurz-Lastenheft mit Copilot erstellen
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde ein technisches Produkt (z. B. ein Transportgestell) und erstelle ein kurzes Lastenheft:
  Zweck, Muss-Anforderungen, Kann-Anforderungen, Randbedingungen.
  ```
  Verfeinere dann:
  ```text
  Formuliere jede Muss-Anforderung überprüfbar (messbar), z. B. „trägt mindestens 50 kg" statt „ist stabil".
  ```
tip: |
  Gute Anforderungen sind messbar und prüfbar – „stabil" ist Auslegungssache, „trägt 50 kg" nicht.
solution: |
  Erwartetes Ergebnis: strukturiertes Lastenheft mit messbaren Muss-Anforderungen. Lernziel: Anforderungen präzise
  und prüfbar formulieren – die Basis für (generatives) Design.
