title: Bereinigungsplan für eine problematische Tabelle
difficulty: 3
question: |
  Eine Kundentabelle hat folgende Probleme: fehlende Umsatzwerte, Datumsangaben in zwei
  verschiedenen Formaten, der Kunde „Müller GmbH" taucht dreifach auf (einmal als „Mueller GmbH"),
  und ein Alterswert lautet „199".

  1. Erstelle einen **Bereinigungsplan** mit der sinnvollen Reihenfolge der Schritte.
  2. Erkläre beim fehlenden Umsatz, warum **„einfach 0 einsetzen" gefährlich** sein kann.
  3. Formuliere einen **Copilot-Prompt (Excel)**, der dich beim Finden dieser Probleme unterstützt.
tip: |
  Erst verstehen, dann bereinigen: „fehlt" kann „0 €" oder „nicht erfasst" bedeuten – ein großer Unterschied.
solution: |
  Bewertungskriterien:

  - Der Plan deckt Vereinheitlichen (Datum), Entdoppeln (Müller/Mueller), Ausreißer (Alter 199) und fehlende Werte ab.
  - Es wird erkannt, dass „0 einsetzen" Durchschnitte/Summen verfälschen kann, wenn der Wert eigentlich „unbekannt" ist.
  - Der Copilot-Prompt ist konkret und zielt auf Prüfung/Analyse (nicht blindes Auto-Bereinigen).
