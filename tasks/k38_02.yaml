title: Geschäftsmodell-Canvas für eine KI-Idee (Copilot)
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde eine KI-Produktidee (ein digitales Angebot) und beschreibe sie in 3 Sätzen.
  ```
  Dann:
  ```text
  Fülle für diese Idee die Kernfelder eines Geschäftsmodells aus: Kundennutzen, Zielkunde,
  Erlösmodell, Schlüsselressourcen, größte Kostenblöcke. Als Tabelle.
  ```
tip: |
  Der wichtigste Block ist der Kundennutzen – ohne echtes Problem, das gelöst wird, trägt kein Erlösmodell.
solution: |
  Erwartetes Ergebnis: ein ausgefülltes, stimmiges Mini-Canvas. Lernziel: eine KI-Idee als Geschäftsmodell
  durchdenken.
