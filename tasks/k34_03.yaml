title: Erklärbarkeits-Anforderungen festlegen (Copilot)
difficulty: 3
question: |
  Definiere **in Copilot** Erklärbarkeits-Anforderungen für ein selbst erzeugtes Szenario.

  **Schritt 1:**
  ```text
  Erfinde einen risikoreichen KI-Einsatz, bei dem Menschen die Entscheidungen verstehen müssen
  (z. B. medizinische Vorsortierung).
  ```
  **Schritt 2:**
  ```text
  Wer muss hier was verstehen? Unterscheide die Bedürfnisse von Betroffenen, Fachleuten und Prüfern
  und leite je eine Erklärbarkeits-Anforderung ab.
  ```
  **Schritt 3:**
  ```text
  Was passiert im Konflikt „hohe Genauigkeit (Black Box) vs. gute Erklärbarkeit"? Wie entscheidest du hier?
  ```

  Bewerte selbst: Wann ist ein etwas schlechteres, aber erklärbares Modell die bessere Wahl?
tip: |
  Verschiedene Zielgruppen brauchen verschiedene Erklärungen. Und manchmal ist Nachvollziehbarkeit wichtiger als das letzte Prozent Genauigkeit.
solution: |
  Erwartetes Ergebnis: zielgruppengerechte Erklärbarkeits-Anforderungen und eine begründete Abwägung
  Genauigkeit vs. Erklärbarkeit. Lernziel: Erklärbarkeit als Anforderung bewusst gestalten.
