title: Teil-Automatisierung eines Back-Office-Prozesses (Copilot)
difficulty: 3
question: |
  Entwirf **in Copilot** ein Automatisierungskonzept für einen selbst erzeugten Prozess.

  **Schritt 1:**
  ```text
  Erfinde einen Back-Office-Prozess mit hohem manuellem Aufwand (z. B. Angebotserstellung).
  ```
  **Schritt 2:**
  ```text
  Trenne den Prozess in drei Zonen: (A) voll automatisierbar, (B) Copilot-assistiert mit
  Mensch-Freigabe, (C) rein menschlich. Begründe jede Zuordnung.
  ```
  **Schritt 3:**
  ```text
  Beschreibe für Zone B einen konkreten Ablauf: Was macht Copilot, wo prüft der Mensch, wie sieht die Freigabe aus?
  ```

  Bewerte selbst: Wo entstehen die größten Risiken, wenn der Mensch die Prüfung überspringt?
tip: |
  „Mensch im Loop": Gerade bei kundenrelevanten oder rechtlich heiklen Schritten braucht es eine bewusste Freigabe.
solution: |
  Erwartetes Ergebnis: klare Zonentrennung, konkreter assistierter Ablauf, benannte Risiken bei fehlender Prüfung.
  Lernziel: sinnvolle Arbeitsteilung Mensch–KI im Prozess gestalten.
