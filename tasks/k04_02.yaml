title: Use-Case-Steckbrief mit Copilot
difficulty: 2
question: |
  Wähle eine KI-Idee (z. B. „Automatische Angebotserstellung"). Lass dir von **Copilot** einen
  Steckbrief strukturieren:

  ```text
  Erstelle einen Use-Case-Steckbrief für die Idee "[deine Idee]" mit den Feldern
  Problem, benötigte Daten, erwarteter Nutzen, Risiken und Machbarkeit.
  Fasse dich je Feld auf 1-2 Sätze.
  ```

  Ergänze anschließend, was Copilot fehlt oder unrealistisch einschätzt.
tip: |
  Prüfe besonders das Feld „benötigte Daten" – hier unterschätzen viele Konzepte den Aufwand.
solution: |
  Bewertungskriterien: vollständiger Steckbrief mit allen fünf Feldern; realistische Einschätzung
  bei Daten und Machbarkeit; erkennbare eigene Ergänzung/Korrektur der Copilot-Ausgabe.
