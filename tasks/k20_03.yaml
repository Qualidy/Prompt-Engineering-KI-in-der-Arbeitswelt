title: Mini-Data-Mining plus Korrelationsfalle (Copilot)
difficulty: 3
question: |
  Führe **in Copilot** eine kleine Data-Mining-Analyse durch – mit selbst erzeugten Daten.

  **Schritt 1:**
  ```text
  Erstelle eine Tabelle mit 15 Zeilen Monatsdaten eines Eiscafés: Monat, Außentemperatur,
  Eisverkäufe, Sonnenbrand-Fälle in der Stadt.
  ```
  **Schritt 2:**
  ```text
  Analysiere Zusammenhänge zwischen den Spalten und beschreibe die stärksten Muster.
  ```
  **Schritt 3 – kritisch:**
  ```text
  Eisverkäufe und Sonnenbrände steigen gemeinsam. Bedeutet das, dass Eis Sonnenbrand verursacht?
  Erkläre den Unterschied zwischen Korrelation und Kausalität.
  ```

  Bewerte selbst: Welche gefundenen „Muster" sind echt nützlich, welche nur Scheinzusammenhänge?
tip: |
  Korrelation ≠ Kausalität. Hier ist die Temperatur die versteckte gemeinsame Ursache.
solution: |
  Erwartetes Ergebnis: erkannte Zusammenhänge und klare Erklärung von Korrelation vs. Kausalität (Temperatur als
  Störgröße). Lernziel: Muster kritisch interpretieren statt vorschnell Ursachen zu behaupten.
