title: Eine Mini-Schulung für Kolleg:innen erstellen
difficulty: 2
question: |
  Nutze **Copilot**, um dein Wissen weiterzugeben (bester Lerntest: es anderen erklären).
  ```text
  Erstelle das Konzept für eine 20-minütige Mini-Schulung "Besser prompten mit Copilot" für
  Kolleg:innen ohne Vorwissen: Ablauf, 3 Kernbotschaften, 1 Live-Übung, 1 typischer Fehler zum Vermeiden.
  ```
  Dann:
  ```text
  Formuliere die Live-Übung so, dass die Teilnehmenden sie ohne eigene Dokumente direkt in Copilot machen können.
  ```
tip: |
  Wer etwas erklären kann, hat es verstanden. Eine gute Übung braucht kein Vorwissen und kein Material.
solution: |
  Erwartetes Ergebnis: ein umsetzbares Schulungskonzept mit selbsttragender Live-Übung. Lernziel: das Gelernte
  didaktisch aufbereiten und weitergeben.
