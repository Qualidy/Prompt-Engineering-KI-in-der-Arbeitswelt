title: KI-Ethik-Leitlinie mit Copilot entwerfen
difficulty: 4
question: |
  Entwirf **in Copilot** eine kompakte KI-Ethik-Leitlinie für ein fiktives Unternehmen.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen und beschreibe, wo es KI einsetzt.
  ```
  **Schritt 2:**
  ```text
  Formuliere 6 klare ethische Grundsätze für den KI-Einsatz (z. B. Transparenz, Mensch entscheidet,
  keine Diskriminierung). Jeder Grundsatz mit einem Satz Begründung.
  ```
  **Schritt 3:**
  ```text
  Mach jeden Grundsatz konkret: Was heißt er im Arbeitsalltag? Nenne je ein Do und ein Don't.
  ```
  **Schritt 4 – Prüfung:** Teste die Leitlinie an einem schwierigen Fall. Gibt sie eine klare Orientierung?

  **Deliverable:** 6 Grundsätze mit Do/Don't + ein durchgespielter Testfall.
tip: |
  Gute Leitlinien sind konkret und anwendbar – nicht bloß schöne Worte, sondern Do's und Don'ts für den Alltag.
solution: |
  Bewertungskriterien: 6 relevante Grundsätze, konkrete Do/Don't, am Testfall bewährte Orientierung. Lernziel:
  Ethik in praktikable Leitplanken übersetzen.
