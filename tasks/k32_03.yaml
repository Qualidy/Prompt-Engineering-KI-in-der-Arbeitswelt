title: Rechtlicher Kurz-Check eines Use Case (Copilot)
difficulty: 3
question: |
  Führe **in Copilot** einen rechtlichen Kurz-Check für ein selbst erzeugtes Szenario durch.

  **Schritt 1:**
  ```text
  Erfinde einen konkreten KI-Use-Case mit rechtlicher Relevanz und beschreibe ihn.
  ```
  **Schritt 2:**
  ```text
  Prüfe: Risikoklasse (EU AI Act), Datenschutzbezug, Haftungsfrage (wer haftet bei Fehlern?),
  Kennzeichnungspflicht. Fasse als Tabelle zusammen.
  ```
  **Schritt 3 – Grenzen:**
  ```text
  Wo endet das, was du (Copilot) hier leisten kannst, und wann ist echte Rechtsberatung nötig?
  ```

  Bewerte selbst: Welche Frage ist am heikelsten und gehört zwingend zu Fachleuten?
tip: |
  Copilot ist keine Rechtsberatung. Es hilft beim Strukturieren der Fragen – die verbindliche Klärung machen Fachleute.
solution: |
  Erwartetes Ergebnis: strukturierter Rechts-Check mit klarer Abgrenzung, wo Fachberatung nötig ist. Lernziel:
  rechtliche Fragen früh erkennen und Grenzen der KI respektieren.
