title: KI-Roadmap für die Produktion in Copilot
difficulty: 4
question: |
  Erstelle **in Copilot** eine KI-Roadmap für einen fiktiven Produktionsbetrieb.

  **Schritt 1:**
  ```text
  Erfinde einen Produktionsbetrieb (Produkt, Größe, aktueller Digitalisierungsgrad).
  ```
  **Schritt 2:**
  ```text
  Sammle 6 mögliche KI-Anwendungen und ordne sie nach Nutzen und Umsetzbarkeit.
  ```
  **Schritt 3:**
  ```text
  Erstelle eine 3-Phasen-Roadmap (kurz-, mittel-, langfristig) mit je 1–2 Maßnahmen und Voraussetzungen.
  ```
  **Schritt 4 – Prüfung:** Ist die Reihenfolge realistisch (erst Datenbasis/Quick Wins, dann Komplexes)? Passe an.

  **Deliverable:** priorisierte KI-Roadmap in 3 Phasen.
tip: |
  Erst die Datenbasis und schnelle Erfolge, dann komplexe Vorhaben wie Predictive Maintenance.
solution: |
  Bewertungskriterien: sinnvolle Priorisierung, realistische Phasen, benannte Voraussetzungen, kritische Prüfung.
  Lernziel: eine schlüssige, umsetzbare KI-Roadmap entwickeln.
