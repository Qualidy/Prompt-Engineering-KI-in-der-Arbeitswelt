title: Fehlerdaten auswerten (Pareto) mit Copilot
difficulty: 2
question: |
  Arbeite **in Copilot** mit selbst erzeugten Daten.
  ```text
  Erstelle eine Tabelle mit 8 Fehlerarten und ihrer Häufigkeit (fiktive Zahlen) für einen Monat.
  ```
  Dann:
  ```text
  Führe eine Pareto-Analyse durch: Welche wenigen Fehlerarten verursachen die meisten Fälle?
  Formuliere, worauf man sich zuerst konzentrieren sollte.
  ```
tip: |
  Pareto-Prinzip: Oft verursachen ~20 % der Fehlerarten ~80 % der Probleme. Dort ansetzen.
solution: |
  Erwartetes Ergebnis: Pareto-Auswertung mit klarer Priorisierung der wichtigsten Fehlerarten. Lernziel:
  Qualitätsdaten auswerten und Verbesserung fokussieren.
