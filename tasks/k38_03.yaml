title: Datengetriebenes Geschäftsmodell mit Burggraben (Copilot)
difficulty: 3
question: |
  Entwirf **in Copilot** ein datengetriebenes Geschäftsmodell für eine selbst erzeugte Idee.

  **Schritt 1:**
  ```text
  Erfinde ein Geschäftsmodell, das auf einem einzigartigen Datenschatz beruht, und beschreibe es.
  ```
  **Schritt 2:**
  ```text
  Erkläre den "Datenschwungrad"-Effekt: Wie führen mehr Nutzer zu besseren Daten, besseren Diensten
  und noch mehr Nutzern?
  ```
  **Schritt 3 – kritisch:**
  ```text
  Was schützt dieses Modell vor Nachahmern (Burggraben)? Und welche 2 größten Risiken (Datenschutz,
  Abhängigkeit) drohen?
  ```

  Bewerte selbst: Ist der Wettbewerbsvorteil echt und dauerhaft?
tip: |
  Der stärkste Schutz ist oft ein sich selbst verstärkender Datenvorteil, den Wettbewerber nicht einfach kopieren können.
solution: |
  Erwartetes Ergebnis: Modell mit erklärtem Schwungrad-Effekt, Burggraben und Risiken; kritische Einschätzung der
  Dauerhaftigkeit. Lernziel: datengetriebene Modelle und ihre Verteidigbarkeit verstehen.
