title: Risiko-Register für ein KI-Projekt (Copilot)
difficulty: 2
question: |
  Arbeite **in Copilot** mit einem selbst erzeugten Projekt.
  ```text
  Erfinde ein KI-Projekt in einem Unternehmen und beschreibe kurz sein Ziel.
  ```
  Dann:
  ```text
  Erstelle ein Risiko-Register (Tabelle): 6 Risiken mit Eintrittswahrscheinlichkeit (hoch/mittel/gering),
  Auswirkung und Gegenmaßnahme. Denke besonders an Datenprobleme und fehlende Akzeptanz.
  ```
tip: |
  Die häufigsten KI-Projekt-Killer sind schlechte Daten und mangelnde Akzeptanz – nicht die Technik.
solution: |
  Erwartetes Ergebnis: strukturiertes Risiko-Register mit realistischen Risiken und Gegenmaßnahmen. Lernziel:
  Projektrisiken früh erkennen und einplanen.
