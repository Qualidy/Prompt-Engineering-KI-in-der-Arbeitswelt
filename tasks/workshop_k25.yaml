title: QM-Verbesserungskonzept mit Copilot
difficulty: 4
question: |
  Erarbeite **in Copilot** ein Qualitätsmanagement-Konzept – mit selbst erzeugten Daten.

  **Schritt 1:**
  ```text
  Erfinde einen Fertigungsbetrieb mit einem Qualitätsproblem und erzeuge eine Fehlerdaten-Tabelle (10 Zeilen).
  ```
  **Schritt 2:**
  ```text
  Analysiere die Daten (Häufigkeiten, Pareto) und benenne die 2 wichtigsten Fehlerquellen.
  ```
  **Schritt 3:**
  ```text
  Entwirf ein Maßnahmenpaket: 1 organisatorische, 1 KI-gestützte Maßnahme, je mit erwartetem Effekt.
  ```
  **Schritt 4 – Prüfung:** Prüfe, ob die KI-Maßnahme angemessen ist oder ob eine einfache Lösung reicht.

  **Deliverable:** Datenauswertung + priorisiertes Maßnahmenpaket.
tip: |
  Nicht jedes Qualitätsproblem braucht KI – manchmal ist eine bessere Arbeitsanweisung wirksamer und billiger.
solution: |
  Bewertungskriterien: saubere Datenauswertung, priorisierte Fehlerquellen, ausgewogenes Maßnahmenpaket, kritische
  Prüfung. Lernziel: QM datenbasiert verbessern und KI angemessen einsetzen.
