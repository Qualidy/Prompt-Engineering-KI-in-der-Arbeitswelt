title: Prozessoptimierung mit Copilot durchführen
difficulty: 4
question: |
  Optimiere **in Copilot** einen kompletten Prozess – selbst erzeugt, ohne echte Unterlagen.

  **Schritt 1:**
  ```text
  Erfinde einen abteilungsübergreifenden Prozess (z. B. Einstellung neuer Mitarbeitender) mit 10 Schritten.
  ```
  **Schritt 2:**
  ```text
  Analysiere: Wo sind Engpässe, Doppelarbeit, Wartezeiten? Markiere sie.
  ```
  **Schritt 3:**
  ```text
  Entwirf den optimierten Prozess und markiere je Schritt, ob/wie Copilot unterstützen kann.
  ```
  **Schritt 4 – Business Case:**
  ```text
  Fasse Nutzen, Aufwand und Risiken in einer kurzen Entscheidungsvorlage zusammen.
  ```
  **Schritt 5 – Prüfung:** Hinterfrage: Sind die KI-Einsätze wirklich sinnvoll oder nur „nice to have"?

  **Deliverable:** Ist-/Soll-Prozess + Entscheidungsvorlage.
tip: |
  Automatisiere keine schlechten Prozesse – erst verbessern, dann (teilweise) automatisieren.
solution: |
  Bewertungskriterien: erkannte Schwachstellen, sinnvoller Soll-Prozess, ehrlicher Business Case, kritische Prüfung.
  Lernziel: Prozessoptimierung strukturiert und entscheidungsreif aufbereiten.
