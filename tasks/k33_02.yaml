title: Datensparsamkeit und Anonymisierung üben
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde einen Datensatz, den ein Unternehmen für eine Auswertung nutzen will (mit einigen
  personenbezogenen Feldern).
  ```
  Dann:
  ```text
  Welche Felder braucht man für die Auswertung wirklich, welche kann man weglassen (Datensparsamkeit)?
  Wie könnte man die verbleibenden Daten anonymisieren oder pseudonymisieren?
  ```
tip: |
  Datensparsamkeit: nur erheben, was wirklich nötig ist. Anonyme Daten sind datenschutzrechtlich unkritisch.
solution: |
  Erwartetes Ergebnis: sinnvolle Reduktion auf nötige Felder und ein Anonymisierungs-/Pseudonymisierungsvorschlag.
  Lernziel: Datenschutz durch Datensparsamkeit und Anonymisierung praktisch umsetzen.
