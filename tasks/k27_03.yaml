title: Autonome Prozessregelung kritisch bewerten (Copilot)
difficulty: 3
question: |
  Untersuche **in Copilot** ein selbst erzeugtes Szenario zur autonomen Regelung.

  **Schritt 1:**
  ```text
  Erfinde einen Prozess, den eine KI weitgehend selbstständig regeln soll, und beschreibe die Ziele.
  ```
  **Schritt 2:**
  ```text
  Beschreibe Nutzen und die 3 größten Risiken der Autonomie (z. B. Fehlregelung, fehlende
  Nachvollziehbarkeit, Sensorausfall).
  ```
  **Schritt 3 – Absicherung:**
  ```text
  Entwirf ein Sicherheitskonzept: Grenzen, menschliche Überwachung, Eingriffsmöglichkeit, Protokollierung.
  ```

  Bewerte selbst: Wie viel Autonomie ist hier verantwortbar?
tip: |
  Je autonomer die Regelung, desto wichtiger sind Überwachung, Nachvollziehbarkeit und ein sicherer Rückfallmodus.
solution: |
  Erwartetes Ergebnis: Nutzen/Risiken plus konkretes Sicherheitskonzept mit menschlicher Eingriffsmöglichkeit.
  Lernziel: Autonomiegrad verantwortungsvoll festlegen.
