title: Content-Paket erstellen und Rechte prüfen (Copilot)
difficulty: 3
question: |
  Erstelle **in Copilot** ein kleines Medienpaket für eine fiktive Kampagne.

  **Schritt 1:**
  ```text
  Erfinde ein Produkt und eine Zielgruppe für eine kleine Marketingkampagne.
  ```
  **Schritt 2:**
  ```text
  Erstelle: 1 Bild-Prompt, 1 Slogan, 1 kurzen Social-Post, 1 E-Mail-Betreff. Alles konsistent im
  gleichen Stil.
  ```
  **Schritt 3 – kritisch:**
  ```text
  Welche rechtlichen/ethischen Punkte muss ich bei KI-generierten Medien beachten (Urheberrecht,
  Kennzeichnung, Persönlichkeitsrechte)? Nenne 3.
  ```

  Bewerte selbst: Ist das Paket wirklich „aus einem Guss"? Was würdest du vor Veröffentlichung prüfen?
tip: |
  KI-generierte Medien werfen Fragen zu Urheberrecht, Kennzeichnungspflicht und Persönlichkeitsrechten auf – mitdenken!
solution: |
  Erwartetes Ergebnis: stimmiges Content-Paket und 3 relevante rechtliche Punkte. Lernziel: Medien-KI produktiv,
  aber verantwortungsbewusst einsetzen.
