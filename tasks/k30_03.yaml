title: Citizen Development mit Governance (Copilot)
difficulty: 3
question: |
  Durchdenke **in Copilot** ein Citizen-Development-Szenario, das Copilot selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde eine Situation, in der Fachabteilungen selbst kleine Apps/Automatisierungen bauen
  (Citizen Development). Beschreibe den Nutzen.
  ```
  **Schritt 2:**
  ```text
  Nenne die 3 größten Risiken (z. B. Schatten-IT, Datenschutz, keine Wartung) mit je einem Beispiel.
  ```
  **Schritt 3:**
  ```text
  Entwirf 5 einfache Governance-Regeln, die den Nutzen erhalten, aber die Risiken begrenzen.
  ```

  Bewerte selbst: Sind deine Regeln praktikabel oder ersticken sie die Eigeninitiative?
tip: |
  Governance soll ermöglichen, nicht verbieten: klare Leitplanken statt kompletter Kontrolle.
solution: |
  Erwartetes Ergebnis: Nutzen, konkrete Risiken und 5 praktikable Governance-Regeln. Lernziel: Citizen Development
  fördern und gleichzeitig absichern.
