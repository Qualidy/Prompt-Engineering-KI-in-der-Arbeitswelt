title: Konzept für KI-gestützte Produktionsplanung
difficulty: 2
question: |
  Arbeite **in Copilot** mit einem selbst erzeugten Szenario.
  ```text
  Erfinde ein Produktionsplanungs-Problem (z. B. schwankende Nachfrage, Maschinenauslastung).
  ```
  Dann:
  ```text
  Entwirf ein Konzept, wie KI hier unterstützen könnte: Welche Daten braucht es, was sagt die KI
  voraus, wer entscheidet am Ende?
  ```
tip: |
  KI liefert Prognosen und Vorschläge – die Planungsentscheidung und Verantwortung bleiben beim Menschen.
solution: |
  Erwartetes Ergebnis: Konzept mit Datenbedarf, KI-Aufgabe und klarer menschlicher Entscheidungsrolle. Lernziel:
  KI als Entscheidungsunterstützung in der Produktion einordnen.
