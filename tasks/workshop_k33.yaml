title: Datenschutz-Leitfaden für Copilot-Nutzung
difficulty: 4
question: |
  Erstelle **in Copilot** einen praxisnahen Datenschutz-Leitfaden für die tägliche KI-Nutzung.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen, das Copilot breit einführen will, und beschreibe typische Nutzungssituationen.
  ```
  **Schritt 2:**
  ```text
  Erstelle eine Ampel-Übersicht: Welche Daten dürfen (grün), nur mit Vorsicht (gelb) oder nie (rot)
  in Copilot eingegeben werden? Mit Beispielen.
  ```
  **Schritt 3:**
  ```text
  Formuliere 6 kurze Verhaltensregeln und 2 typische Fehler, die man vermeiden muss.
  ```
  **Schritt 4 – Prüfung:** Teste den Leitfaden an 3 Alltagssituationen. Ist immer klar, was erlaubt ist?

  **Deliverable:** Ampel-Übersicht + Verhaltensregeln, an 3 Fällen erprobt.
tip: |
  Ampel-Systeme (grün/gelb/rot) sind im Alltag leichter zu befolgen als lange Paragraphen.
solution: |
  Bewertungskriterien: klare Ampel-Logik, praktikable Regeln, an Fällen bewährt. Lernziel: Datenschutz für die
  KI-Nutzung alltagstauglich machen.
