title: Content-Kampagne für einen Produktlaunch in Copilot
difficulty: 4
question: |
  Produziere **in Copilot** ein komplettes Content-Paket für einen fiktiven Produktlaunch.

  **Schritt 1 – Konzept:**
  ```text
  Erfinde ein Produkt, eine Zielgruppe und eine Kernbotschaft für den Launch.
  ```
  **Schritt 2 – Assets erstellen:** Lass Copilot erzeugen: 1 Bild-Prompt fürs Hauptmotiv, 3 Social-Posts
  (verschiedene Kanäle), 1 Newsletter-Text, 5 Hashtags.

  **Schritt 3 – Konsistenz:** Prüfe, ob Tonalität und Botschaft über alle Assets einheitlich sind. Lass Copilot Abweichungen glätten.

  **Schritt 4 – Verantwortung:** Ergänze eine kurze Checkliste, was vor der Veröffentlichung geprüft werden muss (Fakten, Rechte, Kennzeichnung).

  **Deliverable:** das fertige Content-Paket + Veröffentlichungs-Checkliste.
tip: |
  Konsistenz macht Marken stark: Gleiche Tonalität und Botschaft über alle Kanäle hinweg.
solution: |
  Bewertungskriterien: vollständiges, konsistentes Paket, kanalgerechte Texte, sinnvolle Prüf-Checkliste.
  Lernziel: mit KI schnell ein stimmiges, verantwortungsvoll geprüftes Medienpaket erstellen.
