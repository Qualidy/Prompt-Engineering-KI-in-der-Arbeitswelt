title: KI-Sichtprüfung konzipieren und Fehlentscheidungen abwägen
difficulty: 3
question: |
  Konzipiere **in Copilot** eine KI-gestützte Sichtprüfung für ein selbst erzeugtes Szenario.

  **Schritt 1:**
  ```text
  Erfinde ein Produkt und eine optische Qualitätsprüfung, die heute manuell erfolgt.
  ```
  **Schritt 2:**
  ```text
  Beschreibe, wie eine KI-Bildprüfung das übernehmen könnte: Datenbedarf (Beispielbilder gut/schlecht),
  Ablauf, menschliche Rolle.
  ```
  **Schritt 3 – kritisch:**
  ```text
  Erkläre den Unterschied zwischen einem falsch-positiven und einem falsch-negativen Fehler bei
  dieser Prüfung. Welcher ist teurer/gefährlicher – und wie stellt man die KI entsprechend ein?
  ```

  Bewerte selbst: Wie viel Kontrolle behält der Mensch?
tip: |
  Falsch-negativ (schlechtes Teil durchgelassen) ist meist gefährlicher als falsch-positiv (gutes Teil aussortiert).
solution: |
  Erwartetes Ergebnis: Prüfkonzept mit Datenbedarf und klarer Analyse falsch-positiv/negativ inkl. Konsequenz für
  die Einstellung. Lernziel: KI-Qualitätsprüfung mit Fehlerkosten-Denken auslegen.
