title: Change-Management-Plan für eine KI-Einführung
difficulty: 4
question: |
  Erstelle **in Copilot** einen kompletten Change-Plan für eine fiktive Copilot-Einführung.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen und die geplante KI-/Copilot-Einführung.
  ```
  **Schritt 2:**
  ```text
  Erstelle den Plan: Ziele, Stakeholder (mit Haltung), Kommunikationsmaßnahmen, Schulungskonzept,
  Umgang mit Widerständen, Erfolgsmessung.
  ```
  **Schritt 3:**
  ```text
  Entwirf einen 90-Tage-Fahrplan mit den wichtigsten Meilensteinen.
  ```
  **Schritt 4 – Prüfung:** Ist der Plan realistisch und menschenzentriert – oder nur „Technik ausrollen"? Verbessere.

  **Deliverable:** Change-Plan + 90-Tage-Fahrplan.
tip: |
  Technikeinführung ≠ Change Management. Der Erfolg hängt an Kommunikation, Befähigung und Vertrauen.
solution: |
  Bewertungskriterien: klare Ziele, Stakeholder-Analyse, Kommunikation/Schulung, Widerstands- und Erfolgsmanagement,
  realistischer Fahrplan. Lernziel: eine KI-Einführung als Veränderungsprozess gestalten.
