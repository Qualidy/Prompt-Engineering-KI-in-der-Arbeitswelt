title: Dokumenten-Workflow mit Prüfung entwerfen (Copilot)
difficulty: 3
question: |
  Entwirf **in Copilot** einen Verarbeitungs-Workflow für ein selbst erzeugtes Dokument.

  **Schritt 1:**
  ```text
  Erstelle den Text eines fiktiven, teils unklaren Lieferscheins (mit einer widersprüchlichen Angabe).
  ```
  **Schritt 2:**
  ```text
  Extrahiere die relevanten Felder und markiere die widersprüchliche/unsichere Angabe explizit.
  ```
  **Schritt 3 – Prozess:**
  ```text
  Entwirf den Workflow: erfassen → extrahieren → prüfen → freigeben. An welcher Stelle muss ein
  Mensch kontrollieren und warum?
  ```

  Bewerte selbst: Was passiert, wenn man die menschliche Prüfung weglässt?
tip: |
  Automatische Extraktion ist nie 100 % sicher – kritische/mehrdeutige Felder brauchen eine menschliche Freigabe.
solution: |
  Erwartetes Ergebnis: Extraktion mit markierter Unsicherheit und ein Workflow mit klarem menschlichem Prüfpunkt.
  Lernziel: Dokumenten-KI mit eingebauter Qualitätskontrolle denken.
