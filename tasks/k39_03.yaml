title: KI-Strategie mit Priorisierung entwerfen (Copilot)
difficulty: 3
question: |
  Entwirf **in Copilot** eine KI-Strategie für ein selbst erzeugtes Unternehmen.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen (Branche, Ziele, Ausgangslage).
  ```
  **Schritt 2:**
  ```text
  Entwirf eine KI-Strategie mit: Vision, 3 Handlungsfeldern, je einer Make-or-Buy-Entscheidung und
  einem Erfolgs-KPI.
  ```
  **Schritt 3 – priorisieren:**
  ```text
  Priorisiere die 3 Handlungsfelder nach strategischem Wert und Umsetzbarkeit und begründe die Reihenfolge.
  ```

  Bewerte selbst: Ist die Strategie fokussiert oder will sie „alles auf einmal"?
tip: |
  Gute Strategie heißt Fokus: lieber wenige Handlungsfelder konsequent, als überall ein bisschen.
solution: |
  Erwartetes Ergebnis: fokussierte Strategie mit Vision, priorisierten Handlungsfeldern, Make/Buy und KPIs.
  Lernziel: KI strategisch planen und bewusst priorisieren.
