title: Low-Code-App mit Copilot spezifizieren
difficulty: 2
question: |
  Arbeite **in Copilot** mit einer selbst erdachten Idee.
  ```text
  Erfinde eine einfache App-Idee, die ein Team ohne Programmierkenntnisse brauchen könnte
  (z. B. eine Urlaubsantrags-App).
  ```
  Dann:
  ```text
  Spezifiziere sie für ein Low-Code-Tool: welche Eingabefelder, welche Wenn-Dann-Logik, welche
  Ausgaben/Benachrichtigungen. Stelle es strukturiert dar.
  ```
tip: |
  Eine gute Spezifikation beschreibt Eingaben, Logik und Ausgaben – dann lässt sich fast alles im Baukasten bauen.
solution: |
  Erwartetes Ergebnis: klare, umsetzbare Low-Code-Spezifikation. Lernziel: eine Automatisierungsidee so
  beschreiben, dass sie ohne Programmierung baubar ist.
