title: Standardarbeitsanweisung mit Copilot erstellen
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde einen Kundenbeschwerde-Prozess und erstelle daraus eine klare Standardarbeitsanweisung
  (SOP): nummerierte Schritte, Verantwortliche, Zeitvorgaben, Eskalationsregel.
  ```
  Dann verfeinere:
  ```text
  Ergänze zu jedem Schritt einen passenden Copilot-Prompt, den ein Mitarbeiter direkt nutzen könnte
  (z. B. für die Antwort-E-Mail).
  ```
tip: |
  Eine gute SOP ist so klar, dass jede neue Person sie ohne Rückfragen ausführen kann.
solution: |
  Erwartetes Ergebnis: strukturierte SOP mit einsatzbereiten Copilot-Prompts je Schritt. Lernziel: Prozesse
  standardisieren und direkt mit KI-Unterstützung verzahnen.
