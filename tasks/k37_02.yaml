title: Mit Widerständen und Ängsten umgehen (Copilot)
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Nenne die 5 häufigsten Ängste und Widerstände von Mitarbeitenden bei der Einführung von KI
  (z. B. "Ich werde ersetzt").
  ```
  Dann:
  ```text
  Formuliere zu jeder Angst eine ehrliche, ernstnehmende Antwort für eine Mitarbeiter-FAQ – ohne
  zu beschönigen.
  ```
tip: |
  Ängste kleinzureden verstärkt sie. Ehrliche, konkrete Antworten schaffen Vertrauen.
solution: |
  Erwartetes Ergebnis: 5 typische Ängste mit ehrlichen FAQ-Antworten. Lernziel: Widerstände ernst nehmen und
  konstruktiv adressieren.
