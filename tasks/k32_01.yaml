title: Risikoklassen des EU AI Act mit Copilot
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erkläre die vier Risikoklassen des EU AI Act (verboten, hoch, begrenzt, minimal) mit je einem
  Beispiel aus der Arbeitswelt. Als Tabelle.
  ```
tip: |
  Je höher das Risiko für Menschen, desto strenger die Pflichten – von „erlaubt" bis „verboten".
solution: |
  Erwartetes Ergebnis: die 4 Risikoklassen mit passenden Beispielen. Lernziel: den risikobasierten Ansatz der
  KI-Regulierung verstehen.
