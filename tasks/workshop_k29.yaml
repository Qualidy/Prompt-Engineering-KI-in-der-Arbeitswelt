title: Nachhaltigkeits-Konzept mit Copilot erstellen
difficulty: 4
question: |
  Erarbeite **in Copilot** ein Nachhaltigkeitskonzept – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen und beschreibe seine 3 größten Umweltbelastungen.
  ```
  **Schritt 2:**
  ```text
  Ordne jeder Belastung eine KI-gestützte Maßnahme mit messbarem Ziel zu (Tabelle: Belastung,
  Maßnahme, Kennzahl, erwartete Wirkung).
  ```
  **Schritt 3:**
  ```text
  Priorisiere die Maßnahmen nach Wirkung und Aufwand.
  ```
  **Schritt 4 – Prüfung:** Berücksichtige Rebound-Effekte und den KI-Energieverbrauch. Bleibt die Priorisierung bestehen?

  **Deliverable:** priorisiertes Nachhaltigkeitskonzept mit Kennzahlen.
tip: |
  Ehrliche Nachhaltigkeit rechnet den KI-Aufwand und Rebound mit ein – sonst ist es Greenwashing.
solution: |
  Bewertungskriterien: messbare Maßnahmen, sinnvolle Priorisierung, ehrliche Netto-Betrachtung. Lernziel:
  glaubwürdiges, messbares Nachhaltigkeitskonzept mit KI entwickeln.
