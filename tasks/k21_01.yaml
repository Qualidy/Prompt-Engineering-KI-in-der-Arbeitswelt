title: Einen Prozess mit Copilot zerlegen und Engpass finden
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde einen typischen Büroprozess (z. B. Urlaubsantrag) und zerlege ihn in 6–8 Einzelschritte.
  Markiere den Schritt, der wahrscheinlich am längsten dauert (den Engpass).
  ```
  Dann:
  ```text
  Warum ist gerade dieser Schritt der Engpass, und was würde passieren, wenn man nur ihn beschleunigt?
  ```
tip: |
  Ein Prozess ist nur so schnell wie sein Engpass – dort lohnt Optimierung am meisten.
solution: |
  Erwartetes Ergebnis: sauber zerlegter Prozess mit plausibel begründetem Engpass. Lernziel: den entscheidenden
  Engpass erkennen, statt überall gleichzeitig zu optimieren.
