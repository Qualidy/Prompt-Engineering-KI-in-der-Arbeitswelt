title: Bias in KI-Entscheidungen aufspüren
difficulty: 2
question: |
  Arbeite **in Copilot** mit einem selbst erzeugten Beispiel.
  ```text
  Erfinde ein KI-System, das Bewerbungen vorsortiert, und beschreibe, mit welchen historischen
  Daten es trainiert wurde.
  ```
  Dann:
  ```text
  Wie könnte dieses System bestehende Vorurteile (Bias) übernehmen oder verstärken? Nenne 3
  konkrete Beispiele und je eine Gegenmaßnahme.
  ```
tip: |
  KI lernt aus der Vergangenheit – enthält diese Vorurteile, werden sie fortgeschrieben oder sogar verstärkt.
solution: |
  Erwartetes Ergebnis: 3 plausible Bias-Beispiele mit Gegenmaßnahmen. Lernziel: verstehen, wie Verzerrungen
  entstehen und wie man ihnen begegnet.
