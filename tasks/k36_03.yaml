title: Green-AI-Strategie entwerfen (Copilot)
difficulty: 3
question: |
  Entwirf **in Copilot** eine Strategie zur Reduktion des KI-Fußabdrucks für ein selbst erzeugtes Szenario.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen, das KI intensiv nutzt, und beschreibe wo (Nutzung, evtl. Training).
  ```
  **Schritt 2:**
  ```text
  Schlage 5 Maßnahmen vor, um den Energie-/Ressourcenverbrauch zu senken (z. B. passende Modellgröße,
  Caching, fertige Modelle statt Eigen-Training, grüner Strom).
  ```
  **Schritt 3 – ehrlich abwägen:**
  ```text
  Wo steht Effizienz im Konflikt mit Qualität oder Komfort? Wo lohnt der Kompromiss?
  ```

  Bewerte selbst: Welche Maßnahme bringt am meisten bei geringstem Nachteil?
tip: |
  Der größte Hebel ist oft, KEIN eigenes Modell zu trainieren, sondern effiziente, fertige Modelle passend einzusetzen.
solution: |
  Erwartetes Ergebnis: 5 konkrete Maßnahmen mit ehrlicher Abwägung und Priorisierung. Lernziel: KI ressourcen-
  bewusst und dennoch nutzbringend einsetzen.
