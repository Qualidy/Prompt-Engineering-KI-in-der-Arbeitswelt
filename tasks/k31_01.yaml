title: Ethisches Dilemma mit Copilot durchspielen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde ein ethisches Dilemma beim Einsatz von KI am Arbeitsplatz (z. B. KI bewertet
  Mitarbeitende). Beschreibe die Situation und nenne die widerstreitenden Interessen.
  ```
  Dann:
  ```text
  Nenne 3 Argumente dafür und 3 dagegen und formuliere eine abgewogene Empfehlung.
  ```
tip: |
  Ethische Fragen haben selten eine „richtige" Antwort – wichtig ist, Interessen und Folgen offen abzuwägen.
solution: |
  Erwartetes Ergebnis: ein greifbares Dilemma mit ausgewogener Argumentation. Lernziel: ethische Spannungen
  erkennen und strukturiert abwägen.
