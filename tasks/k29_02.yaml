title: Energiedaten mit Copilot auswerten
difficulty: 2
question: |
  Arbeite **in Copilot** mit selbst erzeugten Daten.
  ```text
  Erstelle eine Tabelle mit dem monatlichen Stromverbrauch (12 Monate) einer fiktiven Produktion,
  inkl. einiger auffälliger Ausschläge.
  ```
  Dann:
  ```text
  Analysiere die Daten: Wann ist der Verbrauch auffällig hoch? Nenne 3 mögliche Ursachen und
  3 konkrete Einsparmaßnahmen.
  ```
tip: |
  Auffällige Ausschläge sind oft der schnellste Hebel – erst verstehen, warum, dann handeln.
solution: |
  Erwartetes Ergebnis: erkannte Auffälligkeiten, plausible Ursachen und konkrete Maßnahmen. Lernziel: Verbrauchsdaten
  auswerten und in Einsparungen übersetzen.
