title: KI-Geschäftsmodelle mit Copilot erkunden
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Nenne 5 verschiedene Arten, wie Unternehmen mit KI Geld verdienen (z. B. KI-Feature im Produkt,
  KI-as-a-Service, Datenveredelung). Je ein reales oder plausibles Beispiel.
  ```
tip: |
  KI kann bestehende Produkte verbessern ODER völlig neue Angebote/Erlösmodelle ermöglichen.
solution: |
  Erwartetes Ergebnis: 5 Geschäftsmodell-Muster mit Beispielen. Lernziel: die Bandbreite KI-basierter Wertschöpfung
  überblicken.
