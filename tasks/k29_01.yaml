title: KI für Nachhaltigkeit mit Copilot brainstormen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde ein Unternehmen und nenne 5 Ideen, wie KI dort Ressourcen (Energie, Material, Wege)
  einsparen könnte. Ordne jeder Idee eine messbare Kennzahl zu (z. B. kWh, kg CO2, km).
  ```
tip: |
  Nachhaltigkeit wird erst greifbar, wenn man sie misst – z. B. eingesparte kWh oder Kilometer.
solution: |
  Erwartetes Ergebnis: 5 Ideen mit passenden Kennzahlen. Lernziel: KI-Nutzen für Nachhaltigkeit messbar denken.
