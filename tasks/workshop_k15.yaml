title: Stärken-Schwächen-Landkarte von Copilot erstellen
difficulty: 4
question: |
  Erstelle **in Copilot** durch systematisches Testen eine ehrliche Stärken-Schwächen-Landkarte.

  **Schritt 1 – Testreihe:** Stelle Copilot bewusst 6 unterschiedliche Aufgaben, je 2 aus den Bereichen:
  - Sprache/Text (z. B. umformulieren)
  - Fakten/Zahlen (z. B. eine Rechenaufgabe, eine Jahreszahl)
  - Logik (z. B. ein kleines Rätsel)

  **Schritt 2 – bewerten:**
  ```text
  Erstelle eine Tabelle: Aufgabe, Ergebnis (gut/mittel/schlecht), Grund. Sei ehrlich zu deinen eigenen Grenzen.
  ```

  **Schritt 3 – Regeln ableiten:** Formuliere 5 persönliche Regeln, wofür du Copilot einsetzt und wofür nicht.

  **Deliverable:** die Stärken-Schwächen-Tabelle + 5 persönliche Einsatzregeln.
tip: |
  Testet immer selbst: LLMs sind stark bei Sprache, oft schwach bei exakter Mathematik und aktuellen Fakten.
solution: |
  Bewertungskriterien: aussagekräftige Testreihe, ehrliche Bewertung, 5 sinnvolle Einsatzregeln. Lernziel:
  ein realistisches Bild der LLM-Fähigkeiten entwickeln – aus eigener Erfahrung.
