title: Anforderungen für ein Bauteil mit Copilot sammeln
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Ich will ein Bauteil neu konstruieren: eine Wandhalterung für einen Monitor. Stelle mir 8 Fragen,
  die ich vorher klären muss (Last, Material, Maße, Umgebung, Kosten ...).
  ```
  Dann:
  ```text
  Fasse meine (erfundenen) Antworten in einer kurzen Anforderungsliste zusammen.
  ```
tip: |
  KI im Konstruktionsumfeld beginnt selten mit dem Bauteil selbst, sondern mit klaren Anforderungen.
solution: |
  Erwartetes Ergebnis: sinnvolle Klärungsfragen und eine strukturierte Anforderungsliste. Lernziel: Copilot als
  Denkhilfe in der frühen Konstruktionsphase nutzen.
