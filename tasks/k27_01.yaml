title: Regelkreis mit Copilot verstehen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erkläre an einem Alltagsbeispiel (z. B. Heizungsthermostat) einen Regelkreis: Was sind Sollwert,
  Istwert, Messung und Stellgröße? Wo könnte KI den Regler verbessern?
  ```
tip: |
  Ein Regelkreis misst laufend den Ist-Zustand und steuert nach, um einen Sollwert zu halten.
solution: |
  Erwartetes Ergebnis: klare Erklärung der Regelkreis-Elemente und ein sinnvoller KI-Ansatz. Lernziel: das Prinzip
  der (KI-gestützten) Prozessregelung verstehen.
