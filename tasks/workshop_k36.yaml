title: Green-AI-Konzept mit Copilot erstellen
difficulty: 4
question: |
  Erarbeite **in Copilot** ein Green-AI-Konzept für ein fiktives Unternehmen.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen mit wachsender KI-Nutzung und beschreibe die Ausgangslage.
  ```
  **Schritt 2:**
  ```text
  Erstelle eine Übersicht der größten Energie-/Ressourcentreiber der KI-Nutzung.
  ```
  **Schritt 3:**
  ```text
  Entwirf Maßnahmen (Modellwahl, Nutzungsregeln, Infrastruktur) mit erwartetem Effekt und Aufwand.
  ```
  **Schritt 4:**
  ```text
  Definiere 2 Kennzahlen, mit denen man den KI-Fußabdruck laufend beobachtet.
  ```
  **Schritt 5 – Prüfung:** Vermeidet das Konzept Greenwashing (echte vs. nur behauptete Einsparung)?

  **Deliverable:** Green-AI-Konzept mit Maßnahmen und 2 Kennzahlen.
tip: |
  Was man nicht misst, kann man nicht verbessern – definiere Kennzahlen für den KI-Fußabdruck.
solution: |
  Bewertungskriterien: erkannte Treiber, konkrete Maßnahmen mit Effekt/Aufwand, messbare Kennzahlen, Greenwashing-
  Check. Lernziel: Nachhaltigkeit der eigenen KI-Nutzung steuerbar machen.
