title: Predictive-Maintenance-Konzept end-to-end in Copilot
difficulty: 4
question: |
  Entwickle **in Copilot** ein vollständiges PdM-Konzept – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde einen Betrieb mit mehreren wartungsintensiven Maschinen und beschreibe die Ausgangslage.
  ```
  **Schritt 2:**
  ```text
  Wähle die kritischste Maschine, definiere nötige Sensordaten und die Datenbasis fürs Training.
  ```
  **Schritt 3:**
  ```text
  Beschreibe den Ablauf: von der Datenerfassung über die Warnung bis zur Wartungsentscheidung
  (wer entscheidet?).
  ```
  **Schritt 4:**
  ```text
  Nenne 3 Voraussetzungen und 2 Risiken für den Erfolg.
  ```
  **Schritt 5 – Prüfung:** Ist PdM für diese Maschine wirklich lohnend, oder reicht vorbeugende Wartung?

  **Deliverable:** PdM-Konzept (Maschine, Daten, Ablauf, Voraussetzungen, Risiken).
tip: |
  PdM lohnt vor allem bei teuren, kritischen Maschinen mit guter Datenlage – nicht überall.
solution: |
  Bewertungskriterien: begründete Maschinenauswahl, sinnvoller Datenbedarf, klarer Ablauf mit Entscheidungsrolle,
  ehrliche Lohnt-sich-Prüfung. Lernziel: PdM als Gesamtkonzept durchdenken.
