title: Bild-Prompt und Social-Post mit Copilot
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Schreibe einen detaillierten Bildgenerierungs-Prompt für ein Werbebild einer neuen
  Bio-Limonade: Motiv, Stil, Farben, Stimmung, Bildausschnitt.
  ```
  Dann:
  ```text
  Schreibe dazu einen kurzen Instagram-Post (max. 3 Sätze) mit 3 passenden Hashtags.
  ```
  (Wenn deine Copilot-Version Bilder erzeugen kann, teste den Bild-Prompt direkt.)
tip: |
  Ein guter Bild-Prompt beschreibt Motiv, Stil, Farben, Stimmung und Perspektive – je konkreter, desto besser.
solution: |
  Erwartetes Ergebnis: ein präziser Bild-Prompt und ein passender Social-Post. Lernziel: KI für Medien- und
  Content-Erstellung gezielt ansteuern.
