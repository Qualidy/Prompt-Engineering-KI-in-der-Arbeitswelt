title: Low-Code-Lösung samt Governance in Copilot
difficulty: 4
question: |
  Entwirf **in Copilot** eine komplette Low-Code-Lösung – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde einen manuellen, nervigen Büroprozess, der sich per Low-Code automatisieren ließe.
  ```
  **Schritt 2:**
  ```text
  Spezifiziere die Lösung: Auslöser, Eingaben, Wenn-Dann-Logik, Ausgaben/Benachrichtigungen, beteiligte Systeme.
  ```
  **Schritt 3:**
  ```text
  Beschreibe, wo KI/Copilot in der Lösung mitwirken könnte (z. B. Texte erzeugen, Anfragen einordnen).
  ```
  **Schritt 4:**
  ```text
  Ergänze 3 Governance-Regeln (Datenschutz, Zuständigkeit/Wartung, Freigabe).
  ```
  **Schritt 5 – Prüfung:** Was passiert, wenn die „Erbauerin" das Unternehmen verlässt? Ist die Lösung wartbar?

  **Deliverable:** Low-Code-Spezifikation + KI-Anteil + Governance-Regeln.
tip: |
  Denke an Nachhaltigkeit: Wer wartet die Lösung, wenn die Person, die sie gebaut hat, weg ist?
solution: |
  Bewertungskriterien: umsetzbare Spezifikation, sinnvoller KI-Anteil, praktikable Governance, Wartbarkeit bedacht.
  Lernziel: eine echte Low-Code-Lösung durchdenken – inklusive Betrieb und Absicherung.
