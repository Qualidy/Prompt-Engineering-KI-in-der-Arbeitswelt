title: Fehlerkatalog mit Copilot erstellen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde ein Produkt und erstelle einen Fehlerkatalog: 6 typische Qualitätsfehler mit kurzer
  Beschreibung und der Frage, ob eine Kamera/KI sie erkennen könnte (ja/schwierig).
  ```
tip: |
  Optische Fehler (Kratzer, Farbabweichung) erkennt KI gut; funktionale Fehler oft schwerer.
solution: |
  Erwartetes Ergebnis: Fehlerkatalog mit realistischer Einschätzung der KI-Erkennbarkeit. Lernziel: einschätzen,
  welche Qualitätsprüfungen sich für Bild-KI eignen.
