title: KI-SWOT für ein Unternehmen (Copilot)
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde ein Unternehmen und erstelle eine SWOT-Analyse speziell für den Einsatz von KI:
  Stärken, Schwächen, Chancen, Risiken – je 3 Punkte.
  ```
  Dann:
  ```text
  Leite aus der SWOT die 2 wichtigsten strategischen Schritte ab.
  ```
tip: |
  Stärken/Schwächen sind intern, Chancen/Risiken extern. Strategie heißt: Stärken für Chancen nutzen.
solution: |
  Erwartetes Ergebnis: schlüssige KI-SWOT und 2 abgeleitete Schritte. Lernziel: die eigene KI-Ausgangslage
  strukturiert bewerten.
