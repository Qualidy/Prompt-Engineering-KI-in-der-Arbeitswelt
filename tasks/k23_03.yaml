title: Design-Zielkonflikte mit Copilot durchdenken
difficulty: 3
question: |
  Nutze **in Copilot** ein selbst erzeugtes Konstruktionsszenario.

  **Schritt 1:**
  ```text
  Erfinde ein Bauteil, das gleichzeitig leicht, stabil und günstig sein soll, und beschreibe es.
  ```
  **Schritt 2:**
  ```text
  Erkläre die Zielkonflikte (leicht vs. stabil vs. günstig) und zeige 3 Auslegungsvarianten mit
  ihren Vor-/Nachteilen in einer Tabelle.
  ```
  **Schritt 3 – Einordnung:**
  ```text
  Wo würde spezialisierte generative-Design-Software helfen, und wo hilft ein Werkzeug wie Copilot
  (Ideen, Anforderungen, Doku) und wo nicht?
  ```

  Bewerte selbst: Welche Variante würdest du wählen und warum?
tip: |
  Copilot ersetzt keine CAD-/Simulationssoftware, ist aber stark beim Strukturieren von Anforderungen, Varianten und Doku.
solution: |
  Erwartetes Ergebnis: klar benannte Zielkonflikte, 3 Varianten mit Abwägung, realistische Einordnung der
  Werkzeuge. Lernziel: KI-Rollen in der Konstruktion richtig einschätzen.
