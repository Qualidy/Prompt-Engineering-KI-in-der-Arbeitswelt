title: Service-Chatbot end-to-end in Copilot
difficulty: 4
question: |
  Entwickle und teste **in Copilot** einen kompletten Service-Chatbot – ohne echte Daten.

  **Schritt 1 – Szenario:** Denk dir ein Unternehmen und einen Anwendungsfall aus (z. B. Bestell-Support).

  **Schritt 2 – Wissen erzeugen:**
  ```text
  Erfinde die 8 wichtigsten Infos/FAQs, die dieser Bot kennen muss.
  ```
  **Schritt 3 – Bot-Prompt:** Schreibe einen vollständigen System-Prompt: Rolle, Ton, Gesprächsführung,
  Grenzen, Eskalation an Menschen.

  **Schritt 4 – Testgespräche:** Spiele 3 Dialoge durch: eine einfache Anfrage, eine unzufriedene Kundin,
  eine Frage außerhalb des Wissens.

  **Schritt 5 – verbessern:** Überarbeite den Prompt nach den Tests.

  **Deliverable:** System-Prompt + 3 Testdialoge + Verbesserungsnotizen.
tip: |
  Ein guter Bot weiß, wann er an einen Menschen übergeben muss – definiere klare Eskalationsregeln.
solution: |
  Bewertungskriterien: vollständiger System-Prompt, realistische Testdialoge inkl. Eskalation, sichtbare
  Verbesserung. Lernziel: einen einsatzreifen Chatbot-Prompt gestalten und iterativ härten.
