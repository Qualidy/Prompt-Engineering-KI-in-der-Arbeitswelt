title: Einseitige KI-Strategie in Copilot
difficulty: 4
question: |
  Erstelle **in Copilot** eine einseitige KI-Strategie („One-Pager") für ein fiktives Unternehmen.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen und beschreibe Geschäftsziele und Ausgangslage.
  ```
  **Schritt 2:**
  ```text
  Erstelle den Strategie-One-Pager: Vision, 3 Handlungsfelder mit Maßnahmen, benötigte Ressourcen/
  Kompetenzen, Zeithorizont, Erfolgs-KPIs, Top-Risiken.
  ```
  **Schritt 3:**
  ```text
  Formuliere einen einprägsamen Leitsatz, der die KI-Strategie auf den Punkt bringt.
  ```
  **Schritt 4 – Prüfung:** Zahlt jedes Handlungsfeld klar auf ein Geschäftsziel ein? Streiche, was nur „nice to have" ist.

  **Deliverable:** KI-Strategie-One-Pager mit Leitsatz.
tip: |
  Eine Strategie, die auf eine Seite passt, ist meist klarer und wird eher umgesetzt als ein 50-Seiten-Papier.
solution: |
  Bewertungskriterien: klare Vision, fokussierte Handlungsfelder mit Geschäftsbezug, KPIs/Risiken, prägnanter
  Leitsatz. Lernziel: eine kommunizierbare, fokussierte KI-Strategie formulieren.
