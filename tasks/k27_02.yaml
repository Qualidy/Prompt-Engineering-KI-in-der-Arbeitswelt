title: KI-Regelung mit Sicherheitsgrenzen entwerfen
difficulty: 2
question: |
  Arbeite **in Copilot** mit einem selbst erzeugten Prozess.
  ```text
  Erfinde einen kontinuierlichen Prozess, der geregelt werden muss (z. B. Temperatur in einem
  Gärtank). Beschreibe Sollwert und Störgrößen.
  ```
  Dann:
  ```text
  Entwirf, wie eine KI die Stellgröße automatisch anpasst. Definiere feste Sicherheitsgrenzen, die
  die KI niemals überschreiten darf, und was bei Grenzverletzung passiert.
  ```
tip: |
  KI-Regelungen brauchen harte Sicherheitsgrenzen und einen Notaus – die KI darf nie „frei experimentieren".
solution: |
  Erwartetes Ergebnis: KI-Regelungskonzept mit klaren, unverrückbaren Sicherheitsgrenzen und Notfallverhalten.
  Lernziel: Automatisierung immer mit Sicherheitsleitplanken denken.
