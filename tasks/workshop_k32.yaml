title: Compliance-Checkliste für KI in Copilot
difficulty: 4
question: |
  Erstelle **in Copilot** eine praktische Compliance-Checkliste – für ein fiktives Unternehmen.

  **Schritt 1:**
  ```text
  Erfinde ein Unternehmen, das mehrere KI-Anwendungen einführen will.
  ```
  **Schritt 2:**
  ```text
  Erstelle eine Checkliste mit den wichtigsten rechtlichen Prüfpunkten vor dem Einsatz einer
  KI-Anwendung (Risikoklasse, Datenschutz, Transparenz, Haftung, Dokumentation).
  ```
  **Schritt 3:**
  ```text
  Formuliere jeden Punkt als Ja/Nein-Frage mit einem Hinweis, was bei „Nein" zu tun ist.
  ```
  **Schritt 4 – Prüfung:** Teste die Checkliste an einer Hochrisiko-Anwendung. Deckt sie das Wesentliche ab?

  **Deliverable:** anwendbare Compliance-Checkliste (Ja/Nein-Fragen mit Handlungshinweisen).
tip: |
  Eine gute Checkliste zwingt zum bewussten Prüfen – „Haben wir an Datenschutz gedacht?" darf nicht untergehen.
solution: |
  Bewertungskriterien: relevante Prüfpunkte, klare Ja/Nein-Fragen mit Handlungshinweis, an einem Fall getestet.
  Lernziel: rechtliche Sorgfalt in eine handhabbare Routine gießen.
