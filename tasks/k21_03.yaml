title: Ist-/Soll-Prozess mit Kennzahlen (Copilot)
difficulty: 3
question: |
  Analysiere **in Copilot** einen Prozess von Ist zu Soll – für ein selbst erzeugtes Szenario.

  **Schritt 1:**
  ```text
  Erfinde einen ineffizienten Bestellprozess (Ist-Zustand) mit Zeitangaben je Schritt.
  ```
  **Schritt 2:**
  ```text
  Entwirf den optimierten Soll-Prozess. Zeige in einer Tabelle Ist vs. Soll je Schritt (Dauer,
  Verantwortliche, KI-Unterstützung).
  ```
  **Schritt 3:**
  ```text
  Berechne die Gesamt-Zeitersparnis und nenne einen KPI, an dem man den Erfolg misst.
  ```

  Bewerte selbst: Ist die Zeitersparnis realistisch, oder schöngerechnet?
tip: |
  Ohne Kennzahl (KPI) bleibt „schneller" nur ein Gefühl. Mach den Nutzen messbar.
solution: |
  Erwartetes Ergebnis: Ist/Soll-Vergleich mit Zeitangaben, messbare Ersparnis, passender KPI; kritische Prüfung der
  Annahmen. Lernziel: Prozessoptimierung messbar und ehrlich begründen.
