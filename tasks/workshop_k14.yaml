title: Deine persönliche Prompt-Bibliothek in Copilot
difficulty: 4
question: |
  Baue **in Copilot** eine kleine Prompt-Bibliothek mit 5 wiederverwendbaren Vorlagen für
  häufige Aufgaben – ganz ohne echte Dokumente.

  **Schritt 1:** Wähle 5 typische Alltagsaufgaben (z. B. E-Mail beantworten, Text zusammenfassen,
  Meeting-Agenda erstellen, Ideen sammeln, Text vereinfachen).

  **Schritt 2:** Entwirf für jede eine Vorlage nach dem Muster Rolle – Aufgabe – Kontext – Format,
  mit Platzhaltern in [ECKIGEN KLAMMERN].

  **Schritt 3 – testen:** Lass Copilot je Vorlage einen fiktiven Anwendungsfall erzeugen und
  wende die Vorlage darauf an.

  **Schritt 4 – verbessern:** Notiere bei jeder Vorlage einen Tipp, was das Ergebnis noch besser macht.

  **Deliverable:** 5 getestete, dokumentierte Prompt-Vorlagen zum Weiterverwenden.
tip: |
  Sammle Vorlagen, die sich bewährt haben – so wirst du mit jeder Woche schneller und besser.
solution: |
  Bewertungskriterien: 5 klar strukturierte Vorlagen mit Platzhaltern, an Beispielen getestet, mit
  Verbesserungstipps. Lernziel: Prompting als wiederverwendbare, wachsende Kompetenz aufbauen.
