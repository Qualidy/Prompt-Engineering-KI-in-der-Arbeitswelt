title: KI-Einsatzfelder in der Produktion finden
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde eine kleine Fertigung (was wird produziert?) und nenne 5 Stellen im Produktionsablauf,
  an denen KI helfen könnte. Ordne jeder einen Nutzen zu (Qualität, Tempo, Kosten, Sicherheit).
  ```
tip: |
  KI in der Produktion heißt oft: Sensordaten auswerten, Qualität prüfen, Ausfälle vorhersagen, Abläufe planen.
solution: |
  Erwartetes Ergebnis: 5 plausible Einsatzfelder mit Nutzenzuordnung. Lernziel: den Produktionsablauf systematisch
  nach KI-Potenzialen absuchen.
