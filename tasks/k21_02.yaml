title: Optimierungsideen und KI-Potenzial mit Copilot
difficulty: 2
question: |
  Arbeite **in Copilot** mit einem selbst erzeugten Prozess.
  ```text
  Erfinde einen Rechnungsfreigabe-Prozess mit 7 Schritten inkl. typischer Verzögerungen.
  ```
  Dann:
  ```text
  Schlage 3 Optimierungen vor und markiere, welche davon durch KI/Copilot unterstützt werden könnten
  und welche organisatorisch (ohne KI) gelöst werden. Begründe.
  ```
tip: |
  Nicht jedes Problem braucht KI – manchmal hilft eine klarere Zuständigkeit mehr als ein Algorithmus.
solution: |
  Erwartetes Ergebnis: 3 Optimierungen mit ehrlicher Trennung „KI-tauglich" vs. „organisatorisch". Lernziel:
  KI gezielt dort einsetzen, wo sie wirklich hilft.
