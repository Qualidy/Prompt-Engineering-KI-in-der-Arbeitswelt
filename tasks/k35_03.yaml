title: Ein gescheitertes KI-Projekt obduzieren (Copilot)
difficulty: 3
question: |
  Analysiere **in Copilot** ein selbst erzeugtes Scheitern – eine „Post-Mortem"-Übung.

  **Schritt 1:**
  ```text
  Erfinde ein KI-Projekt, das gescheitert ist, und beschreibe, was schiefgelaufen ist (mind. 3 Ursachen).
  ```
  **Schritt 2:**
  ```text
  Ordne jede Ursache einer Kategorie zu: Daten, Technik, Menschen/Akzeptanz, Management, unklare Ziele.
  ```
  **Schritt 3:**
  ```text
  Formuliere für jede Ursache eine konkrete Maßnahme, die das Scheitern verhindert hätte.
  ```

  Bewerte selbst: Welche Ursache war die eigentliche Wurzel – und welche nur Symptom?
tip: |
  Oft ist die technische Ursache nur ein Symptom – die Wurzel liegt bei unklaren Zielen oder fehlender Einbindung der Menschen.
solution: |
  Erwartetes Ergebnis: strukturierte Ursachenanalyse mit Präventivmaßnahmen und Wurzel-vs-Symptom-Unterscheidung.
  Lernziel: aus typischen Fehlern lernen, bevor sie passieren.
