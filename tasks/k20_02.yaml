title: Kundensegmente per Clustering-Idee bilden
difficulty: 2
question: |
  Arbeite **in Copilot** mit selbst erzeugten Daten.
  ```text
  Erstelle eine Tabelle mit 12 fiktiven Kunden (Alter, Kaufhäufigkeit, durchschnittlicher Bon).
  ```
  Dann:
  ```text
  Teile diese Kunden in 3 sinnvolle Gruppen (Segmente) ein, benenne jede Gruppe und beschreibe
  sie in einem Satz. Erkläre, nach welchen Merkmalen du gruppierst.
  ```
tip: |
  Clustering findet Gruppen ohne Vorgabe. Die Benennung und Interpretation der Gruppen ist deine Aufgabe.
solution: |
  Erwartetes Ergebnis: 3 nachvollziehbare Segmente mit Beschreibung. Lernziel: das Prinzip Clustering/Segmentierung
  verstehen und interpretieren.
