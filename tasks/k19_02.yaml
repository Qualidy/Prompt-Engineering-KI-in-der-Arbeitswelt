title: Infoblatt erstellen und bewerten
difficulty: 2
question: |
  Erstelle mit **Copilot** den Entwurf eines einseitigen Infoblatts für ein Produkt/eine Leistung
  deiner Wahl. Nutze einen Prompt mit Rolle, Zielgruppe, Struktur und Ton.

  Bewerte anschließend: Was ist gut, was musst du fachlich korrigieren, was ergänzen?
tip: |
  Gib die Zielgruppe konkret an – das steuert Sprache und Detailtiefe stark.
solution: |
  Bewertungskriterien: strukturierter, zielgruppengerechter Entwurf; erkannte Korrektur-/Ergänzungsbedarfe;
  Bewusstsein, dass Fakten (Preise, Zahlen) geprüft werden müssen.
