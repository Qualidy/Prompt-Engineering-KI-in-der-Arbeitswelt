title: Kreatives Briefing iterativ verfeinern
difficulty: 2
question: |
  Arbeite **in Copilot** an einem fiktiven Kampagnentext.
  ```text
  Erfinde ein neues Produkt und schreibe einen Werbeslogan dafür.
  ```
  Verfeinere dann gezielt in Varianten:
  ```text
  Gib mir 3 Varianten des Slogans: a) seriös, b) humorvoll, c) emotional.
  Erkläre kurz, für welche Zielgruppe sich welche Variante eignet.
  ```
tip: |
  Lass dir bewusst Varianten für unterschiedliche Zielgruppen/Tonlagen geben – Vergleichen schärft die Wahl.
solution: |
  Erwartetes Ergebnis: 3 unterschiedliche Slogan-Varianten mit Zielgruppen-Einordnung. Lernziel: kreative
  Vielfalt erzeugen und zielgruppengerecht auswählen.
