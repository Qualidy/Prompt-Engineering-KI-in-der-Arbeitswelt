title: Ethik-Check für einen Use Case (Copilot)
difficulty: 3
question: |
  Führe **in Copilot** einen strukturierten Ethik-Check für ein selbst erzeugtes Szenario durch.

  **Schritt 1:**
  ```text
  Erfinde einen KI-Use-Case mit ethischer Sprengkraft (z. B. Verhaltensanalyse von Kunden).
  ```
  **Schritt 2:**
  ```text
  Prüfe ihn entlang von: Fairness, Transparenz, Selbstbestimmung, mögliche Schäden, Verantwortung.
  Bewerte jeden Punkt (unkritisch/bedenklich/kritisch) mit Begründung.
  ```
  **Schritt 3:**
  ```text
  Formuliere Auflagen, unter denen der Einsatz vertretbar wäre – oder begründe, warum man es lassen sollte.
  ```

  Bewerte selbst: Würdest du diesen Use Case verantworten? Warum (nicht)?
tip: |
  „Technisch möglich" heißt nicht „ethisch vertretbar". Ein guter Check endet manchmal mit „nicht umsetzen".
solution: |
  Erwartetes Ergebnis: strukturierte Bewertung entlang der Kriterien und eine klare, begründete Haltung.
  Lernziel: Ethik als bewusste Entscheidung statt Bauchgefühl.
