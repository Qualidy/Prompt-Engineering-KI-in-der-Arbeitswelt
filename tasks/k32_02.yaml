title: KI-Systeme in Risikoklassen einordnen
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde 5 unterschiedliche KI-Anwendungen (vom Spamfilter bis zur Bewerberauswahl).
  ```
  Dann:
  ```text
  Ordne jede einer EU-AI-Act-Risikoklasse zu und begründe. Nenne bei den „hochriskanten" je eine
  Pflicht, die daraus folgt.
  ```
tip: |
  Systeme, die über Menschen entscheiden (Job, Kredit, Bildung), sind meist „hochriskant" und streng reguliert.
solution: |
  Erwartetes Ergebnis: begründete Einordnung und Pflichten für Hochrisiko-Systeme. Lernziel: Anwendungen rechtlich
  einschätzen lernen.
