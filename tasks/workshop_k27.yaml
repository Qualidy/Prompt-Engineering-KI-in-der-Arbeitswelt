title: KI-gestützte Prozessregelung konzipieren (Copilot)
difficulty: 4
question: |
  Konzipiere **in Copilot** eine KI-gestützte Prozessregelung – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde einen industriellen Prozess mit mehreren Stellgrößen und Zielkonflikten (z. B. Qualität
  vs. Energieverbrauch).
  ```
  **Schritt 2:**
  ```text
  Beschreibe, wie KI die Regelung optimiert: Eingangsgrößen, Ziel(e), Stellgrößen.
  ```
  **Schritt 3:**
  ```text
  Definiere Sicherheitsgrenzen, Überwachung und den menschlichen Eingriffspunkt.
  ```
  **Schritt 4:**
  ```text
  Beschreibe, wie man den Regler zuerst risikoarm testet (z. B. Simulation, Parallelbetrieb).
  ```
  **Schritt 5 – Prüfung:** Ist der Testansatz wirklich risikoarm? Verbessere ihn.

  **Deliverable:** Regelungskonzept + Sicherheits- und Testkonzept.
tip: |
  Neue Regler nie sofort scharf schalten – erst simulieren oder parallel mitlaufen lassen und vergleichen.
solution: |
  Bewertungskriterien: klares Regelungsziel, Sicherheitsgrenzen, menschliche Kontrolle, risikoarmer Test.
  Lernziel: KI-Regelung sicher einführen.
