title: Muster in Daten mit Copilot entdecken
difficulty: 1
question: |
  Mach das **live in Copilot** – Copilot erzeugt die Daten selbst.
  ```text
  Erstelle eine kleine Beispiel-Tabelle mit 10 Einkäufen in einem Supermarkt (Artikel je Einkauf).
  ```
  Dann:
  ```text
  Finde Muster: Welche Artikel werden häufig zusammen gekauft? Formuliere daraus eine
  Handlungsempfehlung fürs Regal-Layout.
  ```
tip: |
  Data-Mining sucht Muster in Daten – „wer X kauft, kauft oft auch Y" ist eine klassische Warenkorbanalyse.
solution: |
  Erwartetes Ergebnis: erkannte Kombinationen und eine sinnvolle Empfehlung. Lernziel: das Grundprinzip
  Warenkorbanalyse (Assoziationsregeln) erleben.
