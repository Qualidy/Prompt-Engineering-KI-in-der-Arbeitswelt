title: Data-Mining-Analyse end-to-end in Copilot
difficulty: 4
question: |
  Führe **in Copilot** eine komplette explorative Analyse durch – mit selbst erzeugten Daten.

  **Schritt 1:**
  ```text
  Erstelle einen fiktiven Datensatz mit 20 Zeilen zu Online-Bestellungen (Kundengruppe, Produkt,
  Betrag, Uhrzeit, Retoure ja/nein).
  ```
  **Schritt 2:**
  ```text
  Untersuche den Datensatz: Welche Muster erkennst du (z. B. wer retourniert häufig, welche Produkte
  zu welcher Zeit)? Stelle 3 Erkenntnisse als Tabelle dar.
  ```
  **Schritt 3:**
  ```text
  Leite aus jeder Erkenntnis eine konkrete Geschäftsempfehlung ab.
  ```
  **Schritt 4 – Prüfung:** Hinterfrage jede Empfehlung: Ist der Zusammenhang belastbar oder nur Zufall bei kleiner Datenmenge?

  **Deliverable:** 3 Erkenntnisse + Empfehlungen + kritische Bewertung.
tip: |
  Bei 20 Zeilen sind „Muster" oft Zufall. Sei vorsichtig mit starken Schlüssen aus kleinen Datenmengen.
solution: |
  Bewertungskriterien: plausibler Datensatz, nachvollziehbare Erkenntnisse, konkrete Empfehlungen, kritische
  Reflexion zur Datenmenge. Lernziel: Data-Mining als Kreislauf aus Muster, Empfehlung und Prüfung.
