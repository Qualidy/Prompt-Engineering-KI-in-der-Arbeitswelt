title: Predictive-Maintenance-Konzept skizzieren
difficulty: 2
question: |
  Arbeite **in Copilot** mit einem selbst erzeugten Beispiel.
  ```text
  Erfinde eine Maschine und beschreibe, welche Sensordaten (z. B. Temperatur, Vibration) sie liefert.
  ```
  Dann:
  ```text
  Welche Signale könnten einen nahenden Ausfall ankündigen? Skizziere, wie ein KI-System daraus
  eine Warnung erzeugt und wer wann informiert wird.
  ```
tip: |
  Vorausschauende Wartung braucht historische Daten von Normal- UND Ausfallzuständen, um Muster zu lernen.
solution: |
  Erwartetes Ergebnis: sinnvolle Sensordaten, Ausfallsignale und ein Warnablauf. Lernziel: das Grundprinzip
  Predictive Maintenance konkret durchdenken.
