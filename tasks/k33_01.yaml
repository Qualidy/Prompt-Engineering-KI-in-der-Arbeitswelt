title: Personenbezogene Daten mit Copilot erkennen
difficulty: 1
question: |
  Mach das **live in Copilot**:
  ```text
  Erfinde einen kurzen Beispieltext (z. B. eine Kundenanfrage) und markiere darin alle
  personenbezogenen Daten. Erkläre je Angabe, warum sie personenbezogen ist.
  ```
tip: |
  Personenbezogen ist alles, was eine Person identifizierbar macht – auch indirekt (z. B. Kundennummer + Ort).
solution: |
  Erwartetes Ergebnis: korrekt markierte personenbezogene Daten mit Begründung. Lernziel: sensible Daten sicher
  erkennen – Voraussetzung für Datenschutz.
