title: Projektauftrag für ein KI-Vorhaben in Copilot
difficulty: 4
question: |
  Erstelle **in Copilot** einen kompakten Projektauftrag (Charter) für ein fiktives KI-Vorhaben.

  **Schritt 1:**
  ```text
  Erfinde ein KI-Vorhaben und beschreibe den Anlass/das Problem.
  ```
  **Schritt 2:**
  ```text
  Erstelle den Projektauftrag mit: Ziel + Erfolgskriterium (KPI), Umfang (was NICHT dazugehört),
  benötigte Ressourcen/Daten, Meilensteine, Top-3-Risiken, beteiligte Rollen.
  ```
  **Schritt 3:**
  ```text
  Ergänze einen Plan, wie du die betroffenen Mitarbeitenden früh einbindest (Akzeptanz).
  ```
  **Schritt 4 – Prüfung:** Ist das Ziel wirklich messbar und der Umfang klar abgegrenzt? Schärfe nach.

  **Deliverable:** einseitiger Projektauftrag inkl. Akzeptanzplan.
tip: |
  „Scope Creep" (ständig wachsender Umfang) killt Projekte – definiere klar, was NICHT dazugehört.
solution: |
  Bewertungskriterien: messbares Ziel, klar abgegrenzter Umfang, realistische Meilensteine/Risiken, Akzeptanzplan.
  Lernziel: ein KI-Vorhaben sauber aufsetzen.
