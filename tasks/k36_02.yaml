title: Wann großes, wann kleines Modell? (Copilot)
difficulty: 2
question: |
  Arbeite **in Copilot**.
  ```text
  Erfinde 4 Aufgaben unterschiedlicher Komplexität (von „Tippfehler korrigieren" bis „komplexe
  Analyse").
  ```
  Dann:
  ```text
  Ordne jeder Aufgabe zu, ob ein großes, leistungsstarkes Modell nötig ist oder ein kleines/
  effizientes Modell reicht. Begründe im Sinne von Energie-/Kosteneffizienz.
  ```
tip: |
  Nicht jede Aufgabe braucht das größte Modell – für Einfaches reicht oft ein kleines, sparsames Modell.
solution: |
  Erwartetes Ergebnis: sinnvolle Zuordnung Aufgabe → Modellgröße mit Effizienzbegründung. Lernziel: Ressourcen-
  bewusst das passende Werkzeug wählen.
