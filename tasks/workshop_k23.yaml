title: Konstruktions-Briefing mit Copilot erstellen
difficulty: 4
question: |
  Erstelle **in Copilot** ein vollständiges Konstruktions-Briefing – selbst erzeugt.

  **Schritt 1:**
  ```text
  Erfinde eine Konstruktionsaufgabe aus dem Maschinenbau und beschreibe den Einsatzzweck.
  ```
  **Schritt 2:**
  ```text
  Erstelle: Anforderungsliste (Muss/Kann, messbar), 2 Lösungsvarianten, Bewertungskriterien.
  ```
  **Schritt 3:**
  ```text
  Bewerte die Varianten anhand deiner Kriterien in einer Entscheidungsmatrix und empfiehl eine.
  ```
  **Schritt 4 – Prüfung:** Prüfe, ob die Empfehlung wirklich aus den Kriterien folgt oder „gefühlt" ist.

  **Deliverable:** Anforderungsliste + Varianten + Entscheidungsmatrix mit Empfehlung.
tip: |
  Eine Entscheidungsmatrix macht Konstruktionsentscheidungen nachvollziehbar statt „Bauchgefühl".
solution: |
  Bewertungskriterien: messbare Anforderungen, sinnvolle Varianten, konsistente Matrix, begründete Empfehlung.
  Lernziel: Copilot als Struktur- und Entscheidungshilfe in der Konstruktion nutzen.
