title: Einen Mini-Prozess in Copilot durchspielen
difficulty: 3
question: |
  Spiele **komplett in Copilot** den Prozess „Anfrage → Angebot → Nachfassen" durch. Alle Inhalte
  lässt du Copilot erzeugen – du brauchst keine echten Kundendaten.

  **Schritt 1:**
  ```text
  Erfinde eine kurze Kundenanfrage für 200 bedruckte Notizbücher mit Wunschtermin in 3 Wochen.
  ```
  **Schritt 2:**
  ```text
  Entwirf ein freundliches Angebotsschreiben dazu (Sie-Form, max. 150 Wörter). Setze den
  Endpreis als Platzhalter [PREIS], den ich selbst einsetze.
  ```
  **Schritt 3:**
  ```text
  Formuliere eine höfliche Erinnerung, falls der Kunde nach einer Woche nicht reagiert hat.
  ```

  Notiere anschließend: Welche der drei Schritte könnte Copilot im Alltag übernehmen – und wo
  muss zwingend ein **Mensch** entscheiden? Warum ist [PREIS] ein Platzhalter?
tip: |
  Copilot übernimmt die Formulierungsarbeit. Preise, Konditionen und die finale Freigabe bleiben beim Menschen.
solution: |
  Erwartetes Ergebnis: Drei brauchbare Entwürfe. Einordnung: Copilot = Formulieren (Assistieren); Mensch =
  Preisentscheidung, Machbarkeit, Freigabe. Der Platzhalter [PREIS] verhindert, dass Copilot eine Zahl „erfindet".
