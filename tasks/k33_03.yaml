title: Datenschutz beim Copilot-Einsatz durchdenken
difficulty: 3
question: |
  Analysiere **in Copilot** ein selbst erzeugtes Szenario – mit Fokus auf sicheren Copilot-Einsatz.

  **Schritt 1:**
  ```text
  Erfinde eine Situation, in der Mitarbeitende Copilot mit sensiblen Informationen nutzen wollen.
  ```
  **Schritt 2:**
  ```text
  Welche Daten dürfen NICHT einfach in einen KI-Chat eingegeben werden und warum? Nenne 5 Beispiele.
  ```
  **Schritt 3:**
  ```text
  Formuliere 5 einfache Verhaltensregeln für den datenschutzkonformen Umgang mit Copilot im Alltag.
  ```

  Bewerte selbst: Worin unterscheidet sich ein geschäftlicher (mit Datenschutz) von einem privaten KI-Zugang?
tip: |
  Faustregel: Keine personenbezogenen oder vertraulichen Daten in Prompts, wenn der Datenschutz-Rahmen unklar ist. Geschäftliche Tenants bieten mehr Schutz als private Zugänge.
solution: |
  Erwartetes Ergebnis: klare Liste sensibler Daten und 5 praktikable Verhaltensregeln. Lernziel: Copilot im Alltag
  datenschutzbewusst nutzen.
