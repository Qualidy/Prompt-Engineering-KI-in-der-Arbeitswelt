title: Dokumenten-Verarbeitungsstrecke in Copilot bauen
difficulty: 4
question: |
  Baue **in Copilot** eine komplette Verarbeitungsstrecke – alle Dokumente selbst erzeugt.

  **Schritt 1:**
  ```text
  Erstelle die Texte von 6 gemischten Eingangsdokumenten eines Unternehmens.
  ```
  **Schritt 2:**
  ```text
  Klassifiziere alle, extrahiere je Typ die wichtigsten Felder und leite sie an die richtige Stelle weiter.
  Stelle das Ergebnis als Tabelle dar.
  ```
  **Schritt 3:**
  ```text
  Definiere Prüfregeln: Wann darf automatisch verarbeitet werden, wann muss ein Mensch prüfen?
  ```
  **Schritt 4 – Prüfung:** Schleuse bewusst ein schwieriges Dokument (unklar/unvollständig) ein. Erkennt die Strecke, dass es geprüft werden muss?

  **Deliverable:** Klassifikations-/Extraktionstabelle + Prüfregeln.
tip: |
  Der Wert liegt in der Ausnahmebehandlung: 90 % automatisch, 10 % gezielt zur menschlichen Prüfung.
solution: |
  Bewertungskriterien: korrekte Klassifikation/Extraktion/Routing, sinnvolle Prüfregeln, richtiger Umgang mit dem
  Problemfall. Lernziel: eine praxisnahe Dokumentenstrecke mit Qualitätskontrolle entwerfen.
